<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cập Nhật Thông Tin NMK</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        .table-container { max-height: 75vh; overflow-y: auto; }
        thead th { position: sticky; top: 0; background-color: #f3f4f6; z-index: 1; box-shadow: 0 1px 2px rgba(0,0,0,0.1); }
        .input-error { border-color: #ef4444; background-color: #fef2f2; }
    </style>
</head>
<body class="bg-gray-100 p-4 font-sans text-sm">

    <div class="max-w-[1400px] mx-auto bg-white p-4 rounded-lg shadow">
        <h2 class="text-xl font-bold text-blue-700 mb-4 text-center">CẬP NHẬT TRẠNG THÁI KHÁCH HÀNG NHÀ MẠNG KHÁC</h2>

        <div class="mb-4 flex items-center bg-blue-50 p-3 rounded border border-blue-100">
            <label for="filterNV" class="block font-medium text-gray-700 mr-3">Lọc theo Tên NV:</label>
            <select id="filterNV" class="block w-64 py-1.5 px-3 border border-gray-300 rounded focus:ring-blue-500 focus:border-blue-500">
                <option value="">-- Tải danh sách nhân viên... --</option>
            </select>
        </div>

        <div class="table-container border border-gray-300 rounded">
            <table class="min-w-full divide-y divide-gray-200">
                <thead class="bg-gray-100">
                    <tr>
                        <th class="px-2 py-2 text-left font-semibold text-gray-700 w-24">Ngày giao</th>
                        <th class="px-2 py-2 text-left font-semibold text-gray-700 w-20">Số nhà</th>
                        <th class="px-2 py-2 text-left font-semibold text-gray-700 w-48">Địa chỉ chi tiết</th>
                        <th class="px-2 py-2 text-left font-semibold text-gray-700 w-32">Nhà mạng</th>
                        <th class="px-2 py-2 text-left font-semibold text-red-600">Ấp/Khu vực (*)</th>
                        <th class="px-2 py-2 text-left font-semibold text-red-600">SĐT KH (*)</th>
                        <th class="px-2 py-2 text-left font-semibold text-red-600">Trạng thái chạm (*)</th>
                        <th class="px-2 py-2 text-left font-semibold text-red-600">Kết quả thuyết phục (*)</th>
                        <th class="px-2 py-2 text-left font-semibold text-red-600">Hành động tiếp theo (*)</th>
                        <th class="px-2 py-2 text-left font-semibold text-gray-700">Ngày hẹn QL</th>
                        <th class="px-2 py-2 text-left font-semibold text-gray-700">Ghi chú</th>
                        <th class="px-2 py-2 text-center font-semibold text-gray-700 w-20">Thao tác</th>
                    </tr>
                </thead>
                <tbody id="dataTableBody" class="bg-white divide-y divide-gray-200">
                    <!-- Dữ liệu render tại đây -->
                </tbody>
            </table>
        </div>
        
        <div id="loadingMessage" class="text-center mt-6 text-blue-600 font-bold hidden">Đang tải dữ liệu từ Google Sheet... Vui lòng đợi!</div>
    </div>

    <script>
        // === DÁN LINK WEB APP CỦA BẠN VÀO ĐÂY (Nằm gọn trong 2 dấu nháy đơn) ===
        const API_URL = 'https://script.google.com/macros/s/AKfycbw_koWjLPH02ENXb8Sen724B3KyR9c9mEMN68vqsYGraCKLKkFu2aMI40_ujaAzjuMr/exec'; 

        const optionsTrangThai = ["Chưa chạm", "Đã gặp trực tiếp", "Gặp người nhà", "Không gặp - nhà đóng cửa", "Không gặp - hẹn lại", "Từ chối tiếp xúc"];
        const optionsKetQua = ["Đồng ý lắp đặt", "Cân nhắc - xin SĐT", "Đang xài gói cước khác chưa hết", "So sánh giá - cần tư vấn thêm", "Từ chối - không có nhu cầu", "Từ chối - đã cọc nhà mạng khác"];
        const optionsHanhDong = ["Quay lại sau khi hết cước", "Lên phiếu lắp đặt ngay", "Tiếp tục chăm sóc - gọi điện", "Tiếp tục chăm sóc - ghé lại", "Hẹn khảo sát / đo tín hiệu", "Chuyển CSKH / Kỹ thuật hỗ trợ", "Đã hoàn thành - đóng case", "Không tiềm năng - loại khỏi list"];

        let allData = [];

        function renderTable(dataToRender) {
            const tbody = document.getElementById('dataTableBody');
            tbody.innerHTML = ''; 

            dataToRender.forEach((row, index) => {
                const tr = document.createElement('tr');
                tr.className = "hover:bg-blue-50";
                
                const htmlReadonly = `
                    <td class="px-2 py-2 text-gray-900">${row.Ngày_giao || ''}</td>
                    <td class="px-2 py-2 text-gray-900">${row.Số_nhà_tách || ''}</td>
                    <td class="px-2 py-2 text-gray-900 truncate max-w-[200px]" title="${row.Địa_chỉ_chi_tiết || ''}">${row.Địa_chỉ_chi_tiết || ''}</td>
                    <td class="px-2 py-2 text-gray-900">${row.Nhà_mạng || ''}</td>
                `;

                const htmlInput = `
                    <td class="px-1 py-1"><input type="text" id="ap_${index}" value="${row.Ấp_Khu_vực || ''}" class="w-full border border-gray-300 rounded p-1 focus:ring-blue-500 focus:border-blue-500"></td>
                    <td class="px-1 py-1"><input type="text" id="sdt_${index}" value="${row.SĐT_KH || ''}" class="w-full border border-gray-300 rounded p-1 focus:ring-blue-500 focus:border-blue-500"></td>
                    <td class="px-1 py-1">
                        <select id="tt_${index}" class="w-full border border-gray-300 rounded p-1 focus:ring-blue-500 focus:border-blue-500">
                            <option value="">- Chọn -</option>
                            ${optionsTrangThai.map(opt => `<option value="${opt}" ${row.Trạng_thái_chạm === opt ? 'selected' : ''}>${opt}</option>`).join('')}
                        </select>
                    </td>
                    <td class="px-1 py-1">
                        <select id="kq_${index}" class="w-full border border-gray-300 rounded p-1 focus:ring-blue-500 focus:border-blue-500">
                            <option value="">- Chọn -</option>
                            ${optionsKetQua.map(opt => `<option value="${opt}" ${row.Kết_quả_thuyết_phục === opt ? 'selected' : ''}>${opt}</option>`).join('')}
                        </select>
                    </td>
                    <td class="px-1 py-1">
                        <select id="hd_${index}" class="w-full border border-gray-300 rounded p-1 focus:ring-blue-500 focus:border-blue-500">
                            <option value="">- Chọn -</option>
                            ${optionsHanhDong.map(opt => `<option value="${opt}" ${row.Hành_động_tiếp_theo === opt ? 'selected' : ''}>${opt}</option>`).join('')}
                        </select>
                    </td>
                    <td class="px-1 py-1"><input type="date" id="ngayhen_${index}" value="${row.Ngày_hẹn_quay_lại ? row.Ngày_hẹn_quay_lại.split('T')[0] : ''}" class="w-full border border-gray-300 rounded p-1 focus:ring-blue-500 focus:border-blue-500"></td>
                    <td class="px-1 py-1"><input type="text" id="ghichu_${index}" value="${row.Ghi_chú_chi_tiết || ''}" class="w-full border border-gray-300 rounded p-1 focus:ring-blue-500 focus:border-blue-500"></td>
                    <td class="px-1 py-1 text-center">
                        <button onclick="saveRow(${index}, this)" class="bg-blue-600 hover:bg-blue-700 text-white font-bold py-1 px-3 rounded shadow cursor-pointer">Lưu</button>
                    </td>
                `;

                tr.innerHTML = htmlReadonly + htmlInput;
                tbody.appendChild(tr);
            });
        }

        async function loadData() {
            document.getElementById('loadingMessage').classList.remove('hidden');
            try {
                const response = await fetch(API_URL);
                const result = await response.json();
                
                if(result.status === 'success') {
                    allData = result.data;
                    
                    const nvSelect = document.getElementById('filterNV');
                    const uniqueNV = [...new Set(allData.map(item => item.Tên_NV).filter(Boolean))];
                    nvSelect.innerHTML = '<option value="">-- Chọn tất cả --</option>' + uniqueNV.map(nv => `<option value="${nv}">${nv}</option>`).join('');

                    renderTable(allData);
                } else {
                    alert("Lỗi từ máy chủ: " + result.message);
                }
            } catch (error) {
                alert("Không thể kết nối đến Google Sheet. Vui lòng kiểm tra lại Link API.");
            }
            document.getElementById('loadingMessage').classList.add('hidden');
        }

        document.getElementById('filterNV').addEventListener('change', function(e) {
            const selectedNV = e.target.value;
            renderTable(selectedNV === "" ? allData : allData.filter(row => row.Tên_NV === selectedNV));
        });

        async function saveRow(index, btnElement) {
            const getVal = (id) => document.getElementById(id).value;
            
            const payload = {
                action: "update",
                Địa_chỉ_chi_tiết: allData[index].Địa_chỉ_chi_tiết,
                Ấp_Khu_vực: getVal(`ap_${index}`).trim(),
                SĐT_KH: getVal(`sdt_${index}`).trim(),
                Trạng_thái_chạm: getVal(`tt_${index}`),
                Kết_quả_thuyết_phục: getVal(`kq_${index}`),
                Hành_động_tiếp_theo: getVal(`hd_${index}`),
                Ngày_hẹn_quay_lại: getVal(`ngayhen_${index}`),
                Ghi_chú_chi_tiết: getVal(`ghichu_${index}`).trim()
            };

            if(!payload.Ấp_Khu_vực || !payload.SĐT_KH || !payload.Trạng_thái_chạm || !payload.Kết_quả_thuyết_phục || !payload.Hành_động_tiếp_theo) {
                alert("Vui lòng điền đủ các trường bắt buộc (*)");
                return;
            }

            btnElement.innerText = "...";
            btnElement.disabled = true;

            try {
                const response = await fetch(API_URL, {
                    method: 'POST',
                    body: JSON.stringify(payload),
                    headers: { 'Content-Type': 'text/plain;charset=utf-8' }
                });
                const result = await response.json();
                if(result.status === 'success') {
                    btnElement.innerText = "OK";
                    btnElement.classList.replace("bg-blue-600", "bg-green-600");
                    setTimeout(() => { btnElement.innerText = "Lưu"; btnElement.classList.replace("bg-green-600", "bg-blue-600"); btnElement.disabled = false; }, 2000);
                } else {
                    alert(result.message);
                    btnElement.innerText = "Lưu"; btnElement.disabled = false;
                }
            } catch (error) {
                alert("Lỗi mạng!");
                btnElement.innerText = "Lưu"; btnElement.disabled = false;
            }
        }

        window.onload = loadData;
    </script>
</body>
</html>
