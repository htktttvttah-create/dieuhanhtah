<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Hệ Thống Giao Việc</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root {
    /* Bảng màu hiện đại (Modern SaaS Palette) */
    --primary: #2563eb;       /* Xanh dương sáng chuẩn */
    --primary-hover: #1d4ed8;
    --primary-light: #eff6ff; 
    --bg: #f4f7f9;            /* Xám xanh nhạt cho nền giúp nổi bật thẻ */
    --surface: #ffffff;
    --text-main: #0f172a;     /* Đen slate sâu, dễ đọc */
    --text-muted: #64748b;
    --border: #e2e8f0;
    
    /* Variables cho bo góc và đổ bóng */
    --radius-md: 8px;
    --radius-lg: 12px;
    --radius-xl: 16px;
    --shadow-sm: 0 1px 2px 0 rgb(0 0 0 / 0.05);
    --shadow-md: 0 4px 6px -1px rgb(0 0 0 / 0.05), 0 2px 4px -2px rgb(0 0 0 / 0.05);
    --shadow-lg: 0 10px 15px -3px rgb(0 0 0 / 0.08), 0 4px 6px -4px rgb(0 0 0 / 0.04);
    
    /* Màu Trạng thái */
    --color-new: #f59e0b;
    --color-ip: #8b5cf6;
    --color-done: #10b981;
    --color-urgent: #ef4444;
  }
  
  * { box-sizing: border-box; margin: 0; padding: 0; }
  
  body { 
    font-family: 'Inter', sans-serif; 
    background-color: var(--bg); 
    color: var(--text-main); 
    line-height: 1.6;
    -webkit-font-smoothing: antialiased;
  }

  /* Tùy chỉnh thanh cuộn tinh tế hơn */
  ::-webkit-scrollbar { width: 6px; height: 6px; }
  ::-webkit-scrollbar-track { background: transparent; }
  ::-webkit-scrollbar-thumb { background: #cbd5e1; border-radius: 10px; }
  ::-webkit-scrollbar-thumb:hover { background: #94a3b8; }
  
  /* Topbar */
  .topbar { 
    display: flex; align-items: center; justify-content: space-between; 
    background: var(--surface); padding: 0 20px; height: 64px; 
    box-shadow: var(--shadow-sm); border-bottom: 1px solid var(--border);
    position: sticky; top: 0; z-index: 10; flex-wrap: wrap; 
  }
  .brand { display: flex; align-items: center; gap: 10px; font-weight: 700; font-size: 18px; color: var(--primary); letter-spacing: -0.5px;}
  .brand svg { width: 26px; height: 26px; }
  .user-info { display: flex; align-items: center; gap: 12px; font-size: 13px; font-weight: 500;}
  .role-badge { background: var(--primary-light); color: var(--primary); padding: 4px 10px; border-radius: 99px; font-weight: 600; font-size: 12px;}
  
  .btn-logout, .btn-change-pass {
    background: transparent; border: 1px solid var(--border); padding: 6px 12px; 
    border-radius: var(--radius-md); cursor: pointer; font-size: 13px; font-weight: 500;
    transition: all 0.2s;
  }
  .btn-change-pass { background: var(--surface); color: var(--text-main); }
  .btn-change-pass:hover { background: #f8fafc; border-color: #cbd5e1; }
  .btn-logout { color: var(--text-muted); }
  .btn-logout:hover { color: var(--color-urgent); border-color: var(--color-urgent); background: #fef2f2; }

  #content { padding: 24px 16px; max-width: 1400px; margin: 0 auto; }
  
  /* Dashboard Stats */
  .dashboard { display: flex; overflow-x: auto; gap: 16px; margin-bottom: 24px; padding-bottom: 8px; }
  .stat-card { 
    flex: 1; min-width: 130px; background: var(--surface); padding: 16px; 
    border-radius: var(--radius-lg); border: 1px solid var(--border); 
    box-shadow: var(--shadow-sm); cursor: pointer; transition: all 0.2s; 
  }
  .stat-card:hover { transform: translateY(-2px); box-shadow: var(--shadow-md); }
  .stat-card.active-filter { border-color: var(--primary); background: var(--primary-light); box-shadow: 0 0 0 1px var(--primary); }
  .stat-card h4 { font-size: 12px; color: var(--text-muted); font-weight: 600; margin-bottom: 6px; text-transform: uppercase; letter-spacing: 0.5px;}
  .stat-card .num { font-size: 24px; font-weight: 700; line-height: 1; }
  .stat-all .num { color: var(--primary); }
  .stat-pending .num { color: var(--color-new); }
  .stat-overdue .num { color: var(--color-urgent); }
  .stat-done .num { color: var(--color-done); }

  /* Toolbar */
  .toolbar { 
    display: flex; flex-direction: column; gap: 16px; margin-bottom: 20px; 
    background: var(--surface); padding: 16px; border-radius: var(--radius-lg); 
    border: 1px solid var(--border); box-shadow: var(--shadow-sm);
  }
  .view-switch { background: var(--bg); padding: 4px; border-radius: var(--radius-md); display: flex; border: 1px solid var(--border); }
  .view-switch button { 
    flex: 1; background: transparent; border: none; padding: 8px 12px; 
    font-size: 13px; font-weight: 600; cursor: pointer; border-radius: 6px; 
    color: var(--text-muted); transition: all 0.2s;
  }
  .view-switch button:hover { color: var(--text-main); }
  .view-switch button.active { background: var(--surface); color: var(--primary); box-shadow: var(--shadow-sm); }
  
  .search-box input { 
    width: 100%; padding: 10px 14px; border: 1px solid var(--border); 
    border-radius: var(--radius-md); font-size: 14px; transition: all 0.2s;
  }
  .search-box input:focus { outline: none; border-color: var(--primary); box-shadow: 0 0 0 3px rgba(37, 99, 235, 0.15); }
  
  .btn-export { 
    background: var(--surface); color: var(--text-main); border: 1px solid var(--border); 
    padding: 10px 16px; border-radius: var(--radius-md); cursor: pointer; 
    font-weight: 600; font-size: 13px; transition: all 0.2s;
  }
  .btn-export:hover { background: #f8fafc; border-color: #cbd5e1; }

  /* Generic Cards */
  .card { 
    background: var(--surface); border-radius: var(--radius-lg); 
    padding: 24px; margin-bottom: 24px; box-shadow: var(--shadow-md); 
    border: 1px solid transparent; 
  }
  .card h3 { font-size: 18px; margin-bottom: 16px; display: flex; align-items: center; gap: 8px; color: var(--text-main); }

  /* Form Elements */
  input[type="text"], input[type="password"], input[type="date"], select, textarea { 
    width: 100%; padding: 12px 14px; margin-bottom: 12px; 
    border: 1px solid var(--border); border-radius: var(--radius-md); 
    font-size: 14px; transition: all 0.2s; font-family: inherit; background: var(--surface);
  }
  input:focus, select:focus, textarea:focus { outline: none; border-color: var(--primary); box-shadow: 0 0 0 3px rgba(37, 99, 235, 0.15); }
  
  .form-row { display: flex; flex-direction: column; gap: 16px; margin-bottom: 16px; }
  .form-group label { display: block; font-size: 13px; font-weight: 600; margin-bottom: 6px; color: var(--text-main); }
  
  .assignee-box { 
    border: 1px solid var(--border); border-radius: var(--radius-md); 
    max-height: 150px; overflow-y: auto; padding: 12px; background: #f8fafc; 
    display: grid; grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); gap: 8px;
  }
  .assignee-box label { display: flex; align-items: center; gap: 8px; font-size: 14px; cursor: pointer; }
  .assignee-box input { width: 16px; height: 16px; margin-bottom: 0; cursor: pointer; accent-color: var(--primary);}
  
  button.btn-primary { 
    background: var(--primary); color: white; border: none; padding: 12px 20px; 
    border-radius: var(--radius-md); font-weight: 600; font-size: 14px; 
    cursor: pointer; width: 100%; transition: all 0.2s; box-shadow: var(--shadow-sm);
  }
  button.btn-primary:hover { background: var(--primary-hover); transform: translateY(-1px); box-shadow: var(--shadow-md); }
  button.btn-primary:disabled { background: #94a3b8; cursor: not-allowed; transform: none; }
  
  .file-upload-box { 
    border: 2px dashed #cbd5e1; padding: 16px; border-radius: var(--radius-md); 
    background: #f8fafc; text-align: center; position: relative; transition: all 0.2s; cursor: pointer;
  }
  .file-upload-box:hover { border-color: var(--primary); background: var(--primary-light); }
  .file-upload-box input[type="file"] { position: absolute; top:0; left:0; width: 100%; height: 100%; opacity: 0; cursor: pointer; }
  .file-name-display { font-size: 13px; color: var(--text-muted); margin-top: 6px; }

  /* Thẻ công việc (List View) */
  .task-group { 
    background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius-lg); 
    padding: 16px; margin-bottom: 16px; border-left: 5px solid #cbd5e1; 
    box-shadow: var(--shadow-sm); transition: all 0.2s;
  }
  .task-group:hover { box-shadow: var(--shadow-md); }
  .task-group.status-new { border-left-color: var(--color-new); }
  .task-group.status-in_progress { border-left-color: var(--color-ip); }
  .task-group.status-done { border-left-color: var(--color-done); background: #f8fafc; }
  .task-group.is-overdue { border-left-color: var(--color-urgent) !important; background: #fef2f2; border-right: 1px solid #fecaca; border-top: 1px solid #fecaca; border-bottom: 1px solid #fecaca;}
  .task-group.is-urgent { border: 1px solid #fecaca; border-left: 5px solid var(--color-urgent); background: #fff5f5; }
  
  /* Badges */
  .badge-urgent { 
    background: var(--color-urgent); color: white; animation: pulse 2s infinite; 
    font-weight: 700; padding: 2px 8px; border-radius: 6px; font-size: 11px; letter-spacing: 0.5px;
  }
  @keyframes pulse { 0% { box-shadow: 0 0 0 0 rgba(239, 68, 68, 0.4); } 70% { box-shadow: 0 0 0 6px rgba(239, 68, 68, 0); } 100% { box-shadow: 0 0 0 0 rgba(239, 68, 68, 0); } }
  
  .status-badge { padding: 4px 10px; border-radius: 99px; font-size: 12px; font-weight: 600; display: inline-block; }
  .status-badge.new { background: #fef3c7; color: #b45309; }
  .status-badge.in_progress { background: #ede9fe; color: #6d28d9; }
  .status-badge.done { background: #d1fae5; color: #047857; }

  .task-header { display: flex; justify-content: space-between; align-items: flex-start; margin-bottom: 8px; gap: 16px;}
  .task-title { font-weight: 600; font-size: 16px; display: flex; align-items: center; flex-wrap: wrap; gap: 10px; color: var(--text-main); margin-bottom: 4px;}
  .task-meta { font-size: 13px; color: var(--text-muted); display: flex; flex-wrap: wrap; gap: 12px; align-items: center;}
  
  .btn-toggle-detail { 
    background: #f1f5f9; border: 1px solid var(--border); padding: 4px 10px; 
    border-radius: 6px; font-size: 12px; font-weight: 600; cursor: pointer; 
    color: var(--text-main); transition: background 0.2s;
  }
  .btn-toggle-detail:hover { background: #e2e8f0; }
  
  .btn-edit, .btn-del { padding: 4px 10px; border-radius: 6px; font-size: 12px; font-weight: 600; cursor:pointer; transition: all 0.2s;}
  .btn-edit { background: var(--primary-light); color: var(--primary); border: 1px solid #bfdbfe; }
  .btn-edit:hover { background: #dbeafe; }
  .btn-del { background: #fef2f2; color: #dc2626; border: 1px solid #fecaca; }
  .btn-del:hover { background: #fee2e2; }

  .task-details { display: none; margin-top: 16px; border-top: 1px dashed var(--border); padding-top: 16px; }
  .task-details.show { display: block; animation: fadeIn 0.3s ease; }
  @keyframes fadeIn { from { opacity: 0; transform: translateY(-5px); } to { opacity: 1; transform: translateY(0); } }
  
  .task-desc { font-size: 14px; margin-bottom: 16px; background: #f8fafc; padding: 12px; border-radius: var(--radius-md); border: 1px solid var(--border); white-space: pre-wrap;}
  
  .progress-container { margin-bottom: 16px; }
  .progress-header { display: flex; justify-content: space-between; font-size: 13px; font-weight: 600; margin-bottom: 6px; color: var(--text-main);}
  .progress-bar { height: 8px; background: #e2e8f0; border-radius: 99px; overflow: hidden; }
  .progress-fill { height: 100%; background: var(--color-done); transition: width 0.5s ease; }
  
  .member-row { 
    display: flex; justify-content: space-between; align-items: center; 
    padding: 10px 12px; border-radius: var(--radius-md); margin-bottom: 8px; 
    background: var(--surface); border: 1px solid var(--border); font-size: 13px; 
  }
  .m-status { font-size: 12px; padding: 2px 8px; border-radius: 99px; font-weight: 600; }
  .m-status.new { background: #fef3c7; color: #b45309; }
  .m-status.in_progress { background: #ede9fe; color: #6d28d9; }
  .m-status.done { background: #d1fae5; color: #047857; }

  .btn-action { padding: 6px 12px; border-radius: 6px; font-size: 12px; font-weight: 600; border: none; cursor: pointer; transition: all 0.2s; box-shadow: var(--shadow-sm);}
  .btn-action:hover { transform: translateY(-1px); box-shadow: var(--shadow-md); }
  .btn-receive { background: var(--primary); color: white; }
  .btn-start { background: var(--color-ip); color: white; }
  .btn-done { background: var(--color-done); color: white; }
  
  .btn-log { 
    background: var(--surface); border: 1px solid var(--border); color: var(--text-main); 
    margin-top: 12px; width: 100%; padding: 10px; font-weight: 600; border-radius: var(--radius-md);
  }
  .btn-log:hover { background: #f8fafc; border-color: #cbd5e1; }

  /* View Bảng (Table) */
  .table-view { background: var(--surface); border-radius: var(--radius-lg); overflow-x: auto; border: 1px solid var(--border); box-shadow: var(--shadow-sm);}
  table { width: 100%; border-collapse: collapse; min-width: 800px; }
  th, td { padding: 14px 16px; text-align: left; border-bottom: 1px solid var(--border); font-size: 14px; }
  th { background: #f8fafc; font-weight: 600; color: var(--text-main); white-space: nowrap;}
  tbody tr:hover { background: #f8fafc; }

  /* Kanban */
  .kanban-board { flex-direction: column; gap: 20px; }
  .kanban-col { background: #f1f5f9; border-radius: var(--radius-lg); padding: 16px; border: 1px solid var(--border);}
  .kanban-col h3 { font-size: 14px; margin-bottom: 16px; display: flex; justify-content: space-between; font-weight: 600; align-items: center;}
  .kanban-col h3 span { background: #e2e8f0; padding: 2px 8px; border-radius: 99px; font-size: 12px;}
  .kanban-cards { display: flex; flex-direction: column; gap: 12px; min-height: 100px;}
  
  .k-card { 
    background: var(--surface); padding: 16px; border-radius: var(--radius-md); 
    border-left: 4px solid var(--primary); font-size: 13px; cursor: pointer;
    box-shadow: var(--shadow-sm); transition: all 0.2s;
  }
  .k-card:hover { box-shadow: var(--shadow-md); transform: translateY(-2px); }
  .k-card.status-new { border-left-color: var(--color-new); }
  .k-card.status-in_progress { border-left-color: var(--color-ip); }
  .k-card.status-done { border-left-color: var(--color-done); opacity: 0.8; }
  .k-card.is-urgent { border: 1px solid #fecaca; border-left: 4px solid var(--color-urgent); background: #fff5f5; }

  /* Modal */
  .modal-overlay { 
    position: fixed; top: 0; left: 0; right: 0; bottom: 0; 
    background: rgba(15, 23, 42, 0.6); backdrop-filter: blur(4px);
    display: flex; align-items: center; justify-content: center; 
    z-index: 100; padding: 16px; 
  }
  .modal-content { 
    background: var(--surface); padding: 24px; border-radius: var(--radius-xl); 
    width: 100%; max-height: 90vh; overflow-y: auto; box-shadow: var(--shadow-lg);
    animation: modalPop 0.3s ease-out;
  }
  @keyframes modalPop { 0% { transform: scale(0.95); opacity: 0; } 100% { transform: scale(1); opacity: 1; } }
  
  .modal-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px; border-bottom: 1px solid var(--border); padding-bottom: 16px;}
  .modal-header h3 { font-size: 18px; margin: 0; color: var(--text-main); }
  .close-btn { 
    background: #f1f5f9; border: none; font-size: 20px; cursor: pointer; 
    color: var(--text-muted); width: 32px; height: 32px; border-radius: 50%;
    display: flex; align-items: center; justify-content: center; transition: all 0.2s;
  }
  .close-btn:hover { background: #e2e8f0; color: var(--text-main); }
  
  /* Bình luận */
  .comment-list { max-height: 300px; overflow-y: auto; margin-bottom: 16px; padding-right: 8px; }
  .comment-item { 
    background: #f8fafc; padding: 12px; border-radius: var(--radius-md); 
    margin-bottom: 10px; font-size: 14px; border: 1px solid var(--border);
  }
  .comment-item b { color: var(--primary); font-weight: 600;}
  .comment-item.time-line { 
    border: none; background: transparent; padding: 0 0 10px 0; margin-bottom: 10px; 
    border-bottom: 1px dashed var(--border); color: var(--text-muted); font-size: 13px; 
  }
  .comment-input-box { display: flex; flex-direction: column; gap: 10px; background: #f8fafc; padding: 16px; border-radius: var(--radius-lg); border: 1px solid var(--border);}
  .comment-input-box input { margin-bottom: 0; border-radius: var(--radius-md); }
  
  /* Trang Đăng Nhập */
  .login-wrapper { 
    display: flex; align-items: center; justify-content: center; 
    min-height: 100vh; padding: 16px; background: linear-gradient(135deg, #f0f9ff 0%, #e0f2fe 100%);
  }
  .login-card { 
    width: 100%; max-width: 420px; text-align: center; 
    background: var(--surface); padding: 40px 32px; 
    border-radius: var(--radius-xl); box-shadow: var(--shadow-lg); border: none;
  }
  .login-card svg { width: 48px; height: 48px; color: var(--primary); margin-bottom: 16px;}
  .login-card h2 { font-size: 24px; color: var(--text-main); font-weight: 700; margin-bottom: 8px;}
  .login-card p { color: var(--text-muted); font-size: 14px; margin-bottom: 24px;}
  .login-card input { padding: 14px; font-size: 15px; margin-bottom: 16px; background: #f8fafc;}
  .login-card button { padding: 14px; font-size: 15px; margin-top: 8px;}
  .login-msg { color: #ef4444; font-size: 13px; font-weight: 600; margin-bottom: 16px; background: #fef2f2; padding: 8px; border-radius: 6px; display: none;}

  /* Responsive Desktop */
  @media (min-width: 768px) {
    .form-row { flex-direction: row; }
    .toolbar { flex-direction: row; justify-content: space-between; align-items: center; }
    .view-switch { flex: none; }
    .search-box { max-width: 350px; flex: 1; }
    .kanban-board { display: grid; grid-template-columns: repeat(3, 1fr); }
    .btn-log { width: auto; margin-top: 16px; }
    .task-header { align-items: center; }
  }
</style>
</head>
<body>
<div id="app"></div>

<!-- Modal Đổi Mật Khẩu -->
<div id="modal-change-pass" class="modal-overlay" style="display:none;">
  <div class="modal-content" style="max-width: 420px;">
    <div class="modal-header">
      <h3>🔑 Đổi Mật Khẩu</h3>
      <button class="close-btn" onclick="document.getElementById('modal-change-pass').style.display='none'">&times;</button>
    </div>
    <div style="display:flex; flex-direction:column; gap: 4px;">
        <label style="font-size: 13px; font-weight: 600;">Mật khẩu hiện tại</label>
        <input type="password" id="old-pass" placeholder="Nhập mật khẩu hiện tại">
        
        <label style="font-size: 13px; font-weight: 600; margin-top: 8px;">Mật khẩu mới</label>
        <input type="password" id="new-pass" placeholder="Nhập mật khẩu mới">
        
        <label style="font-size: 13px; font-weight: 600; margin-top: 8px;">Nhập lại mật khẩu mới</label>
        <input type="password" id="confirm-pass" placeholder="Nhập lại mật khẩu mới">
    </div>
    <div style="display:flex; gap:12px; justify-content:flex-end; margin-top:24px;">
      <button class="btn-logout" id="btn-cancel-pass" style="padding:10px 20px;">Hủy</button>
      <button class="btn-primary" style="width:auto; padding:10px 20px;" id="btn-save-pass">Lưu thay đổi</button>
    </div>
  </div>
</div>

<!-- Modal Chi Tiết / Bình luận -->
<div id="modal-detail" class="modal-overlay" style="display:none;">
  <div class="modal-content" style="max-width: 650px;">
    <div class="modal-header">
      <h3 id="modal-title">Chi tiết công việc</h3>
      <button class="close-btn" onclick="document.getElementById('modal-detail').style.display='none'">&times;</button>
    </div>
    <div id="modal-body"></div>
  </div>
</div>

<!-- Modal Sửa Công Việc -->
<div id="modal-edit" class="modal-overlay" style="display:none;">
  <div class="modal-content" style="max-width: 650px;">
    <div class="modal-header">
      <h3>✏️ Chỉnh sửa công việc</h3>
      <button class="close-btn" onclick="document.getElementById('modal-edit').style.display='none'">&times;</button>
    </div>
    <div style="display: flex; flex-direction: column; gap: 16px;">
      <input type="hidden" id="edit-group-id">
      
      <div class="form-row" style="margin-bottom:0; gap: 16px;">
        <div class="form-group" style="flex: 2;">
          <label>Tiêu đề</label>
          <input type="text" id="edit-title">
        </div>
        <div class="form-group">
          <label>Ưu tiên</label>
          <select id="edit-priority">
            <option value="Bình thường">Bình thường</option>
            <option value="Khẩn cấp">Khẩn cấp</option>
          </select>
        </div>
      </div>

      <div class="form-row" style="margin-bottom:0; gap: 16px;">
        <div class="form-group" style="flex: 1;">
          <label>Hạn hoàn thành</label>
          <input type="date" id="edit-deadline">
        </div>
        <div class="form-group" style="flex: 2;">
          <label>Link đính kèm</label>
          <input type="text" id="edit-link" placeholder="https://...">
        </div>
      </div>

      <div class="form-group">
        <label>Mô tả chi tiết</label>
        <textarea id="edit-desc" style="min-height: 80px; resize: vertical;"></textarea>
      </div>

      <div class="form-group">
        <label>Kết quả / Báo cáo (Dành cho Giám đốc nhập)</label>

async function api(action, data = {}) {
  const res = await fetch(API_URL, {
    method: 'POST', headers: { 'Content-Type': 'text/plain;charset=utf-8' }, 
    body: JSON.stringify({ action, data })
  });
  const json = await res.json();
  if (json.error) throw new Error(json.error);
  return json.data;
}

function getBase64(file) {
  return new Promise((resolve, reject) => {
    const reader = new FileReader();
    reader.readAsDataURL(file);
    reader.onload = () => resolve(reader.result);
    reader.onerror = error => reject(error);
  });
}

function getDeadlineInfo(deadlineStr, status) {
  if (!deadlineStr || status === 'done') return { isOverdue: false, isWarning: false, text: '', daysLeft: null };
  const today = new Date(); today.setHours(0,0,0,0);
  const deadline = new Date(deadlineStr); deadline.setHours(0,0,0,0);
  const diffDays = Math.ceil((deadline.getTime() - today.getTime()) / (1000 * 60 * 60 * 24));
  
  if (diffDays < 0) return { isOverdue: true, isWarning: false, text: 'Quá hạn ' + Math.abs(diffDays) + ' ngày', daysLeft: diffDays };
  if (diffDays === 0) return { isOverdue: false, isWarning: true, text: 'Hạn chót hôm nay', daysLeft: diffDays };
  if (diffDays <= 2) return { isOverdue: false, isWarning: true, text: 'Còn ' + diffDays + ' ngày', daysLeft: diffDays };
  return { isOverdue: false, isWarning: false, text: '', daysLeft: diffDays };
}

function processAndRender(canAct) {
  const isManager = (me.role === 'director' || me.role === 'deputy');
  const isHTKT = (me.role === 'htkt');
  const canSeeAll = isManager || isHTKT;
  
  const groups = {};
  allTasksCache.forEach(t => {
    const gid = t['Mã nhóm'] || ('LEGACY_' + t['ID']);
    if (!groups[gid]) {
      groups[gid] = {
        groupId: gid, title: t['Tiêu đề'], desc: t['Mô tả'], assigner: t.assigner_name,
        deadline: t['Hạn hoàn thành'], link: t['File đính kèm'], priority: t['Độ ưu tiên'] || 'Bình thường', members: []
      };
    }
    groups[gid].members.push({
      rowId: t['ID'], userId: String(t['Người nhận']), name: t.assignee_name, status: t['Trạng thái'] || 'new', result: t['Kết quả']
    });
  });

  let displayGroups = Object.values(groups);

  if (!canSeeAll) {
    displayGroups = displayGroups.filter(g => g.members.some(m => m.userId === String(me.id)));
  }

  const keyword = document.getElementById('search-input')?.value.toLowerCase().trim() || '';
  
  displayGroups = displayGroups.filter(g => {
    let matchKeyword = true;
    if (keyword) {
      matchKeyword = g.title.toLowerCase().includes(keyword) || 
                     g.members.some(m=>m.name.toLowerCase().includes(keyword));
    }
    if (!matchKeyword) return false;
    
    let doneM = g.members.filter(m => m.status === 'done').length;
    let isDone = doneM === g.members.length;
    const dl = getDeadlineInfo(g.deadline, isDone ? 'done' : 'new');

    if (currentFilter === 'pending') return !isDone;
    if (currentFilter === 'overdue') return dl.isOverdue && !isDone;
    if (currentFilter === 'warning') return dl.isWarning && !isDone;
    if (currentFilter === 'done') return isDone;
    return true;
  });

  let total = Object.keys(groups).length;
  let done = 0, overdue = 0, warning = 0, pending = 0;
  
  Object.values(groups).forEach(g => {
    let doneCount = g.members.filter(m => m.status === 'done').length;
    if (doneCount === g.members.length) { done++; }
    else {
      pending++;
      const dl = getDeadlineInfo(g.deadline, 'new');
      if (dl.isOverdue) overdue++;
      if (dl.isWarning) warning++;
    }
  });

  const dbEl = document.getElementById('dashboard');
  if (dbEl) {
    dbEl.innerHTML = `
      <div class="dashboard">
        <div class="stat-card stat-all ${currentFilter === 'all' ? 'active-filter' : ''}" onclick="filterTasks('all')">
          <h4>📂 Tất cả</h4><div class="num">${Object.keys(groups).length}</div>
        </div>
        <div class="stat-card stat-pending ${currentFilter === 'pending' ? 'active-filter' : ''}" onclick="filterTasks('pending')">
          <h4>📋 Chưa xong</h4><div class="num">${pending}</div>
        </div>
        <div class="stat-card ${currentFilter === 'warning' ? 'active-filter' : ''}" style="${currentFilter === 'warning' ? 'border-color:#f97316; background:#fff7ed; box-shadow:0 0 0 1px #f97316;' : ''}" onclick="filterTasks('warning')">
          <h4>⏳ Sắp tới hạn</h4><div class="num" style="color:#f97316">${warning}</div>
        </div>
        <div class="stat-card stat-overdue ${currentFilter === 'overdue' ? 'active-filter' : ''}" onclick="filterTasks('overdue')">
          <h4>⚠️ Quá hạn</h4><div class="num">${overdue}</div>
        </div>
        <div class="stat-card stat-done ${currentFilter === 'done' ? 'active-filter' : ''}" onclick="filterTasks('done')">
          <h4>✅ Đã xong</h4><div class="num">${done}</div>
        </div>
      </div>`;
  }

  if (currentView === 'list') renderListView(displayGroups, canAct);
  else if (currentView === 'kanban') renderKanbanView(displayGroups, canAct);
  else if (currentView === 'table') renderTableView(displayGroups, canAct);
}

function filterTasks(type) {
  currentFilter = type;
  processAndRender(true);
}

function renderListView(displayGroups, canAct) {
  const el = document.getElementById('task-list');
  if (!displayGroups.length) { 
    el.innerHTML = `
      <div class="card" style="text-align:center; padding: 40px; color:var(--text-muted); font-size:15px; background:transparent; border: 2px dashed var(--border); box-shadow:none;">
        <div style="margin-bottom: 16px; font-weight: 500;">Chưa có công việc nào hoặc không tìm thấy việc phù hợp.</div>
        <div style="display:flex; justify-content:center; gap:12px; flex-wrap: wrap;">
          <button onclick="forceRefresh()" class="btn-action" style="background:var(--primary); color:white; border:none; padding:10px 20px;">🔄 Làm mới dữ liệu</button>
          <button onclick="document.getElementById('logout').click()" class="btn-logout" style="padding:10px 20px; border: 1px solid var(--border);">Đăng nhập lại</button>
        </div>
      </div>`; 
    return; 
  }

  displayGroups.sort((a, b) => {
    const dlA = getDeadlineInfo(a.deadline, 'new');
    const dlB = getDeadlineInfo(b.deadline, 'new');
    if (dlA.isOverdue && !dlB.isOverdue) return -1;
    if (!dlA.isOverdue && dlB.isOverdue) return 1;
    if (dlA.isWarning && !dlB.isWarning) return -1;
    if (!dlA.isWarning && dlB.isWarning) return 1;
    return 0;
  });

  const STATUS = { new: { label: 'Mới', cls: 'new' }, received: { label: 'Đã nhận', cls: 'received' }, in_progress: { label: 'Đang làm', cls: 'in_progress' }, done: { label: 'Hoàn thành', cls: 'done' } };
  const isManager = (me.role === 'director' || me.role === 'deputy');

  el.innerHTML = displayGroups.map(g => {
    let totalM = g.members.length;
    let doneM = g.members.filter(m => m.status === 'done').length;
    let percent = Math.round((doneM / totalM) * 100);
    let groupStatus = doneM === totalM ? 'done' : (doneM > 0 || g.members.some(m=>m.status!=='new') ? 'in_progress' : 'new');
    let dl = getDeadlineInfo(g.deadline, groupStatus);
    
    let isUrgent = (g.priority === 'Khẩn cấp' || g.priority === 'Cao');
    let priorityBadge = isUrgent ? `<span class="badge-urgent">🚨 KHẨN CẤP</span>` : ``;
    
    let statusObj = {
      new: { text: 'Mới giao', cls: 'new' },
      in_progress: { text: 'Đang làm', cls: 'in_progress' },
      done: { text: 'Hoàn thành', cls: 'done' }
    }[groupStatus] || { text: 'Mới giao', cls: 'new' };
    let statusBadge = `<span class="status-badge ${statusObj.cls}">${statusObj.text}</span>`;
    
    let urgentClass = isUrgent ? 'is-urgent' : '';
    
    let isExpanded = expandedGroups.has(g.groupId);
    let membersHtml = g.members.map(m => {
      let mStatus = STATUS[m.status] || STATUS.new;
      let actionBtn = '';
      if (m.userId === String(me.id)) {
        if (m.status === 'new') actionBtn = `<button class="btn-action btn-receive" data-id="${m.rowId}" data-to="in_progress">▶️ Nhận & Bắt đầu</button>`;
        else if (m.status === 'received') actionBtn = `<button class="btn-action btn-start" data-id="${m.rowId}" data-to="in_progress">▶️ Bắt đầu</button>`;
        else if (m.status === 'in_progress') actionBtn = `<button class="btn-action btn-done" data-id="${m.rowId}" data-to="done">✅ Báo Cáo Xong</button>`;
      }
      return `<div class="member-row">
        <div class="m-info" style="display:flex; align-items:center; gap:10px;">
            <div style="background:#e2e8f0; width:28px; height:28px; border-radius:50%; display:flex; align-items:center; justify-content:center; font-size:12px;">👤</div>
            <span class="m-name" style="font-weight:500;">${m.name}</span> 
            <span class="m-status ${mStatus.cls}">${mStatus.label}</span>
        </div>
        <div>${actionBtn}</div>
      </div>`;
    }).join('');

    let countdownHtml = '';
    if (g.deadline && dl.daysLeft !== null) {
       if (dl.daysLeft < 0) countdownHtml = `<span style="color:var(--color-urgent); font-weight:600; font-size:12px; background:#fef2f2; padding: 2px 6px; border-radius:4px;">Trễ ${Math.abs(dl.daysLeft)} ngày</span>`;
       else if (dl.daysLeft === 0) countdownHtml = `<span style="color:#f97316; font-weight:600; font-size:12px; background:#fff7ed; padding: 2px 6px; border-radius:4px;">Hạn chót hôm nay</span>`;
       else countdownHtml = `<span style="color:${dl.daysLeft <= 2 ? '#f97316' : 'var(--primary)'}; font-weight:600; font-size:12px; background:${dl.daysLeft <= 2 ? '#fff7ed' : 'var(--primary-light)'}; padding: 2px 6px; border-radius:4px;">Còn ${dl.daysLeft} ngày</span>`;
    }

    let adminButtons = '';
    if (isManager) {
      adminButtons = `<div style="display:flex; gap:8px;"><button class="btn-edit" data-edit="${g.groupId}">✏️ Sửa</button> <button class="btn-del" data-del="${g.groupId}">🗑️ Xóa</button></div>`;
    }

    return `<div class="task-group ${urgentClass} status-${groupStatus} ${dl.isOverdue ? 'is-overdue' : ''}">
      <div class="task-header">
        <div style="flex:1;">
          <div class="task-title">
            <span>${g.title}</span>
            ${priorityBadge}
            ${statusBadge}
          </div>
          <div class="task-meta">
            <span>✍️ Người giao: <b style="color:var(--text-main); font-weight:500;">${g.assigner}</b></span>
            ${g.deadline ? `<span style="display:flex; align-items:center; gap:6px;">📅 Hạn chót: <b style="color:var(--text-main); font-weight:500;">${fmtDate(g.deadline)}</b> ${countdownHtml}</span>` : ''}
          </div>
        </div>
        <div style="display:flex; flex-direction:column; align-items:flex-end; gap:8px;">
            ${adminButtons}
            <button class="btn-toggle-detail" data-toggle="${g.groupId}">${isExpanded ? '▲ Thu gọn' : '▼ Xem chi tiết'}</button>
        </div>
      </div>
      
      <div class="task-details ${isExpanded ? 'show' : ''}">
        ${g.desc ? `<div class="task-desc">${g.desc}</div>` : '<div class="task-desc" style="color:var(--text-muted); font-style:italic;">Không có mô tả chi tiết.</div>'}
        
        ${g.link ? `<div style="margin-bottom:20px;"><a href="${g.link}" target="_blank" style="color:var(--primary); font-weight:600; font-size:14px; text-decoration:none; display:inline-flex; align-items:center; gap:6px; padding:8px 12px; background:var(--primary-light); border-radius:8px; border:1px solid #bfdbfe; transition:all 0.2s;">📎 Truy cập File / Link đính kèm</a></div>` : ''}
        
        <div class="progress-container">
          <div class="progress-header"><span>Tiến độ hoàn thành</span><span>${doneM}/${totalM} (${percent}%)</span></div>
          <div class="progress-bar"><div class="progress-fill" style="width: ${percent}%"></div></div>
        </div>
        <div class="members-list">${membersHtml}</div>
        
        <button class="btn-action btn-log" onclick="openDetail('${g.members[0].rowId}', '${g.groupId}')">💬 Thảo luận & Lịch sử hoạt động</button>
      </div>
    </div>`;
  }).join('');

  attachEvents(el, displayGroups, canAct);
}

function renderKanbanView(displayGroups, canAct) {
  const cols = { new: [], in_progress: [], done: [] };
  displayGroups.forEach(g => {
    let doneM = g.members.filter(m => m.status === 'done').length;
    let groupStatus = doneM === g.members.length ? 'done' : (doneM > 0 || g.members.some(m=>m.status!=='new') ? 'in_progress' : 'new');
    cols[groupStatus].push(g);
  });

  for (let key in cols) {
    const countEl = document.getElementById(`count-${key}`);
    if (countEl) countEl.innerText = cols[key].length;
    
    const container = document.querySelector(`#col-${key} .kanban-cards`);
    if (!container) continue;

    if (cols[key].length === 0) {
      container.innerHTML = `<div style="text-align:center; color:#94a3b8; font-size:13px; padding: 30px 0; border: 1px dashed #cbd5e1; border-radius:8px;">Trống</div>`;
      continue;
    }

    container.innerHTML = cols[key].map(g => {
      let dl = getDeadlineInfo(g.deadline, key);
      let isUrgent = (g.priority === 'Khẩn cấp' || g.priority === 'Cao');
      let urgentClass = isUrgent ? 'is-urgent' : '';
      let prioHtml = isUrgent ? `<span style="color:var(--color-urgent); font-weight:700; font-size:11px;">🚨 Khẩn cấp</span>` : `<span style="color:var(--text-muted); font-size:11px;">Bình thường</span>`;

      return `<div class="k-card status-${key} ${urgentClass}" onclick="openDetail('${g.members[0].rowId}', '${g.groupId}')">
        <div style="display:flex; justify-content:space-between; font-size:11px; margin-bottom:8px; align-items:center;">
          ${prioHtml}
          ${dl.isOverdue ? `<span style="color:white; background:var(--color-urgent); padding:2px 6px; border-radius:4px; font-weight:bold;">Trễ hạn</span>` : ''}
        </div>
        <div style="font-weight:600; margin-bottom:8px; color:var(--text-main); font-size:14px; line-height:1.4;">${g.title}</div>
        <div style="color:var(--text-muted); margin-bottom:6px; font-size:12px; display:flex; align-items:center; gap:4px;">👤 ${g.members.map(m=>m.name).join(', ')}</div>
        <div style="color:var(--text-muted); font-size:12px; display:flex; align-items:center; gap:4px;">📅 ${g.deadline ? fmtDate(g.deadline) : 'Không có hạn'}</div>
      </div>`;
    }).join('');
  }
}

function renderTableView(displayGroups, canAct) {
  const tbody = document.getElementById('table-body');
  
  if (!displayGroups.length) {
    tbody.innerHTML = `<tr><td colspan="7" style="text-align:center; padding: 40px; color:#94a3b8;">
      <div style="margin-bottom: 16px; font-weight: 500; font-size: 14px;">Chưa có công việc nào hoặc không tìm thấy việc phù hợp.</div>
      <div style="display:flex; justify-content:center; gap:12px; flex-wrap: wrap;">
        <button onclick="forceRefresh()" class="btn-action" style="background:var(--primary); color:white; border:none; padding:8px 16px;">🔄 Làm mới</button>
        <button onclick="document.getElementById('logout').click()" class="btn-logout" style="padding:8px 16px; border: 1px solid var(--border);">Đăng nhập lại</button>
      </div>
    </td></tr>`;
    return;
  }

  tbody.innerHTML = displayGroups.map(g => {
    let doneM = g.members.filter(m => m.status === 'done').length;
    let groupStatus = doneM === g.members.length ? 'Hoàn thành' : 'Đang làm';
    let dl = getDeadlineInfo(g.deadline, groupStatus === 'Hoàn thành' ? 'done' : 'new');
    let isUrgent = (g.priority === 'Khẩn cấp' || g.priority === 'Cao');
    let prioHtml = isUrgent ? `<b style="color:var(--color-urgent); background:#fef2f2; padding:2px 6px; border-radius:4px; font-size:12px;">Khẩn cấp</b>` : `<span style="color:var(--text-muted); font-size:12px;">Bình thường</span>`;
    let stHtml = groupStatus === 'Hoàn thành' ? `<span style="color:var(--color-done); font-weight:600;">Hoàn thành</span>` : `<span style="color:var(--color-ip); font-weight:600;">Đang làm</span>`;
    
    return `<tr>
      <td style="color:var(--text-muted); font-size:12px;">#${g.members[0].rowId}</td>
      <td style="font-weight:500; color:var(--text-main);">${g.title}</td>
      <td>${g.members.map(m=>m.name).join(', ')}</td>
      <td>${prioHtml}</td>
      <td style="color:${dl.isOverdue?'var(--color-urgent)':(dl.isWarning?'#f97316':'inherit')}; font-weight:${(dl.isOverdue || dl.isWarning)?'600':'normal'}">${fmtDate(g.deadline)}</td>
      <td>${stHtml}</td>
      <td><button class="btn-log" style="margin-top:0; padding:6px 12px; font-size:12px;" onclick="openDetail('${g.members[0].rowId}', '${g.groupId}')">Chi tiết</button></td>
    </tr>`;
  }).join('');
}

function attachEvents(el, displayGroups, canAct) {
  el.querySelectorAll('button[data-to]').forEach(btn => {
    btn.onclick = async (e) => {
      e.stopPropagation();
      const to = btn.dataset.to;
      let note = to === 'done' ? prompt('Nhập kết quả hoặc ghi chú (không bắt buộc):') || '' : '';
      
      const originalText = btn.innerText;
      btn.innerText = 'Đang xử lý...';
      btn.disabled = true;
      
      try {
        await api('updateStatus', { taskId: btn.dataset.id, status: to, note, user_id: me.id });
        renderMain();
      } catch (err) {
        alert(err.message);
        btn.innerText = originalText;
        btn.disabled = false;
      }
    };
  });

  el.querySelectorAll('button[data-toggle]').forEach(btn => {
    btn.onclick = (e) => {
      e.stopPropagation();
      const gid = btn.dataset.toggle;
      if (expandedGroups.has(gid)) expandedGroups.delete(gid);
      else expandedGroups.add(gid);
      processAndRender(canAct);
    };
  });

  el.querySelectorAll('button[data-del]').forEach(btn => {
    btn.onclick = async (e) => {
      e.stopPropagation();
      if (confirm('⚠️ Bạn có chắc chắn muốn xóa vĩnh viễn toàn bộ công việc này?')) {
        btn.innerText = 'Đang xóa...';
        btn.disabled = true;
        await api('deleteTask', { groupId: btn.dataset.del });
        renderMain();
      }
    };
  });

  el.querySelectorAll('button[data-edit]').forEach(btn => {
    btn.onclick = (e) => {
      e.stopPropagation();
      const gid = btn.dataset.edit;
      const group = displayGroups.find(x => x.groupId === gid);
      if (!group) return;

      document.getElementById('edit-group-id').value = group.groupId;
      document.getElementById('edit-title').value = group.title;
      
      let displayPriority = (group.priority === 'Cao' || group.priority === 'Khẩn cấp') ? 'Khẩn cấp' : 'Bình thường';
      document.getElementById('edit-priority').value = displayPriority;
      
      document.getElementById('edit-desc').value = group.desc;
      document.getElementById('edit-link').value = group.link || '';
      document.getElementById('edit-deadline').value = group.deadline ? group.deadline.split('T')[0] : '';
      document.getElementById('edit-result').value = group.members[0].result || '';
      
      // Khởi tạo danh sách checkbox người nhận
      let currentMemberIds = group.members.map(m => m.userId);
      const assigneeHtml = globalAssignableUsers.map(u => {
        let isChecked = currentMemberIds.includes(String(u.id)) ? 'checked' : '';
        return `<label><input type="checkbox" name="edit-assignee" value="${u.id}" ${isChecked}>${u.name}</label>`;
      }).join('');
      document.getElementById('edit-assignee-box').innerHTML = assigneeHtml;

      document.getElementById('modal-edit').style.display = 'flex';
    };
  });
}

async function saveEditTask() {
  const btn = document.querySelector('#modal-edit .btn-primary');
  const originalText = btn.innerText;
  
  const selectedAssignees = Array.from(document.querySelectorAll('input[name="edit-assignee"]:checked')).map(cb => cb.value);
  if (selectedAssignees.length === 0) {
      btn.innerText = 'Cần ít nhất 1 người nhận!';
      setTimeout(() => { btn.innerText = originalText; }, 2000);
      return;
  }

  btn.innerText = 'Đang lưu...';
  btn.disabled = true;

  const data = {
    groupId: document.getElementById('edit-group-id').value,
    title: document.getElementById('edit-title').value.trim(),
    priority: document.getElementById('edit-priority').value,
    deadline: document.getElementById('edit-deadline').value,
    description: document.getElementById('edit-desc').value.trim(),
    link: document.getElementById('edit-link').value.trim(),
    result: document.getElementById('edit-result').value.trim(),
    assigned_to: selectedAssignees,
    send_telegram: document.getElementById('edit-send-tele').checked
  };

  try {
    await api('updateTask', data);
    document.getElementById('modal-edit').style.display = 'none';
    if (me.role === 'director' || me.role === 'deputy') renderManager();
    else renderEmployee();
  } catch (e) {
    btn.innerText = 'Lỗi: ' + e.message;
  } finally {
    if(btn.innerText === 'Đang lưu...') {
        btn.innerText = originalText;
    }
    btn.disabled = false;
  }
}

function allowDrop(ev) { ev.preventDefault(); }
function drag(ev, groupId) { ev.dataTransfer.setData("groupId", groupId); }
async function drop(ev, newStatus) {
  ev.preventDefault();
  const groupId = ev.dataTransfer.getData("groupId");
  if (!groupId) return;
  
  const tasksInGroup = allTasksCache.filter(t => (t['Mã nhóm'] || ('LEGACY_' + t['ID'])) === groupId);
  for (let t of tasksInGroup) {
    if (t['Trạng thái'] !== newStatus) {
      await api('updateStatus', { taskId: t.ID, status: newStatus, note: 'Đã kéo thả trên Kanban', user_id: me.id });
    }
  }
  renderMain();
}

async function openDetail(taskId, groupId) {
  currentDetailTaskId = taskId;
  const modal = document.getElementById('modal-detail');
  const body = document.getElementById('modal-body');
  modal.style.display = 'flex';
  body.innerHTML = '<div style="text-align:center; padding:40px; color:var(--text-muted);">Đang tải dữ liệu chi tiết...</div>';

  try {
    const logs = await api('getLogs', { taskId });
    
    const groupTasks = allTasksCache.filter(t => String(t['Mã nhóm'] || ('LEGACY_' + t['ID'])) === String(groupId));
    const firstTask = groupTasks[0];
    
    if (!firstTask) {
      body.innerHTML = `<p style="color:var(--color-urgent); text-align:center; padding:20px;">Lỗi: Không tìm thấy dữ liệu công việc này.</p>`;
      return;
    }

    let historyHtml = logs.map(l => {
      if (l['Hành động'] === 'comment') {
        return `<div class="comment-item"><b>${l.user_name}:</b> <span style="color:var(--text-main);">${l['Ghi chú']}</span> <div style="color:var(--text-muted); font-size:11px; margin-top:6px;">🕒 ${fmt(l['Thời gian'])}</div></div>`;
      }
      let act = { created:'Đã tạo công việc', received:'Đã nhận việc', in_progress:'Bắt đầu làm', done:'Báo cáo hoàn thành' }[l['Hành động']] || l['Hành động'];
      return `<div class="comment-item time-line">👉 <b>${l.user_name}</b> ${act} vào lúc ${fmt(l['Thời gian'])}</div>`;
    }).join('');

    body.innerHTML = `
      <h2 style="color:var(--text-main); font-size:20px; margin-bottom:12px;">${firstTask['Tiêu đề']}</h2>
      <div style="background:#f8fafc; padding:16px; border-radius:8px; border:1px solid var(--border); margin-bottom:20px;">
        <p style="font-size:14px; white-space:pre-wrap; color:var(--text-main);">${firstTask['Mô tả'] || '<span style="color:var(--text-muted); font-style:italic;">Không có mô tả chi tiết.</span>'}</p>
      </div>
      
      <div style="display:flex; flex-wrap:wrap; gap:24px; font-size:14px; color:var(--text-main); margin-bottom:20px; background:var(--surface); padding:16px; border-radius:8px; border:1px solid var(--border);">
        <span style="display:flex; align-items:center; gap:8px;">👤 Người nhận: <b>${firstTask.assignee_name}</b></span>
        <span style="display:flex; align-items:center; gap:8px;">📅 Hạn chót: <b>${fmtDate(firstTask['Hạn hoàn thành']) || 'Không có'}</b></span>
      </div>
      
      ${firstTask['File đính kèm'] ? `<div style="margin-bottom:24px;"><a href="${firstTask['File đính kèm']}" target="_blank" style="display:inline-flex; align-items:center; gap:8px; padding:10px 20px; background:var(--primary-light); color:var(--primary); text-decoration:none; border-radius:8px; font-weight:600; font-size:14px; border:1px solid #bfdbfe; transition:all 0.2s;">📎 Mở File đính kèm</a></div>` : ''}
      
      <h4 style="margin-bottom:16px; padding-bottom:8px; font-size:16px; border-bottom:2px solid var(--border);">💬 Thảo luận & Lịch sử</h4>
      <div class="comment-list" id="comment-list-box">${historyHtml || '<div style="text-align:center; padding:20px; color:var(--text-muted); font-style:italic;">Chưa có hoạt động hoặc bình luận nào.</div>'}</div>
      
      <div class="comment-input-box">
        <input type="text" id="comment-input-${taskId}" placeholder="Viết bình luận hoặc cập nhật tiến độ... (Nhấn Enter để gửi)" onkeypress="if(event.key === 'Enter') submitComment('${taskId}')">
        <button class="btn-primary" id="btn-submit-${taskId}" onclick="submitComment('${taskId}')" style="width:auto; align-self:flex-end;">Gửi bình luận</button>
      </div>
    `;
    
    setTimeout(() => {
      const box = document.getElementById('comment-list-box');
      if (box) box.scrollTop = box.scrollHeight;
    }, 100);

  } catch (e) {
    body.innerHTML = `<p style="color:var(--color-urgent); text-align:center; padding:20px;">Lỗi tải dữ liệu: ${e.message}</p>`;
  }
}

async function submitComment(taskId) {
  const input = document.getElementById(`comment-input-${taskId}`);
  const btn = document.getElementById(`btn-submit-${taskId}`);
  const text = input.value.trim();
  if (!text) return;
  
  input.disabled = true;
  btn.disabled = true;
  btn.innerText = 'Đang gửi...';
  
  try {
    await api('addComment', { taskId, userId: me.id, note: text });
    
    const box = document.getElementById('comment-list-box');
    const newHtml = `<div class="comment-item"><b>${me.name}:</b> <span style="color:var(--text-main);">${text}</span> <div style="color:var(--text-muted); font-size:11px; margin-top:6px;">🕒 Vừa xong</div></div>`;
    if (box.innerHTML.includes('Chưa có hoạt động')) box.innerHTML = '';
    box.innerHTML += newHtml;
    box.scrollTop = box.scrollHeight;
    
    input.value = '';
    
    // Refresh background data quietly
    setTimeout(() => {
       const gid = allTasksCache.find(t => String(t.ID) === String(taskId))['Mã nhóm'];
       if (gid) {
           // We don't fully reopen to avoid flicker, just let the data sit.
           // If you want to force full refresh of the list behind the modal:
           if (me.role === 'director' || me.role === 'deputy') api('getTasks').then(t => { allTasksCache = t; });
       }
    }, 500);

  } catch (err) {
    alert("Lỗi gửi bình luận: " + err.message);
  } finally {
    input.disabled = false;
    btn.disabled = false;
    btn.innerText = 'Gửi bình luận';
    input.focus();
  }
}

function exportCSV() {
  let csvContent = "data:text/csv;charset=utf-8,\uFEFF";
  csvContent += "Mã,Tiêu đề,Người nhận,Ưu tiên,Hạn chót,Trạng thái\n";
  allTasksCache.forEach(t => {
    let isUrgent = (t['Độ ưu tiên'] === 'Khẩn cấp' || t['Độ ưu tiên'] === 'Cao');
    let pText = isUrgent ? 'Khẩn cấp' : 'Bình thường';
    csvContent += `${t.ID},"${t['Tiêu đề']}","${t.assignee_name}","${pText}","${fmtDate(t['Hạn hoàn thành'])}","${t['Trạng thái']}"\n`;
  });
  const encodedUri = encodeURI(csvContent);
  const link = document.createElement("a");
  link.setAttribute("href", encodedUri);
  link.setAttribute("download", "Danh_sach_cong_viec.csv");
  document.body.appendChild(link);
  link.click();
  document.body.removeChild(link);
}

if (token && me) renderMain(); else renderLogin();
</script>
