        };

            }
            // LƯU Ý QUAN TRỌNG: AI KHÔNG bị giới hạn targetCategory nếu chỉ gõ "cam" hoặc "mesh".
            // Nhờ đó nó sẽ quét Xuyên Bảng toàn bộ tất cả các bảng để lôi ra mọi gói có dính tới Mesh/Cam!

            // 3. NHẬN DIỆN NGÂN SÁCH (Smart Budgeting - Áp dụng cho MỌI bảng)
            // Explicit MIN
            const minMatch = cleanQueryForText.match(/\b(tren|over|>|lon hon|tu)\s*(\d+)(?:\s*(k|ngan|000))?\b/i);
            if (minMatch) {
                let val = parseInt(minMatch[2]);
                if (val >= 10 && val <= 999) val = val * 1000;
                minPrice = val;
                activeFilters.push(`Giá > ${val/1000}k`);
                cleanQueryForText = cleanQueryForText.replace(minMatch[0], '');
            }

            // Explicit MAX
            const maxMatch = cleanQueryForText.match(/\b(duoi|under|<|toi da|nho hon|be hon)\s*(\d+)(?:\s*(k|ngan|000))?\b/i);
            if (maxMatch) {
                let val = parseInt(maxMatch[2]);
                if (val >= 10 && val <= 999) val = val * 1000;
                maxPrice = val;
                activeFilters.push(`Giá < ${val/1000}k`);
                cleanQueryForText = cleanQueryForText.replace(maxMatch[0], '');
            }

            // Implicit BUDGET (Tự hiểu số tiền đơn độc là ngân sách tối đa)
            if (!maxPrice && !minPrice) {
                const implicitMatch = cleanQueryForText.match(/\b(\d+)(?:\s*(k|ngan|000))?\b/i);
                if (implicitMatch) {
                     let val = parseInt(implicitMatch[1]);
                     if (val >= 20) { // Lớn hơn 20 để tránh nhầm với số đếm như "Home 1", "Home 2"
                         if (val <= 999) val = val * 1000;
                         maxPrice = val; 
                         activeFilters.push(`Ngân sách ≤ ${val/1000}k`);
                         cleanQueryForText = cleanQueryForText.replace(implicitMatch[0], '');
                     }
                } else if (cleanQueryForText.match(/\b(kinh te|re nhat|gia re|re)\b/i)) {
                     maxPrice = 220000; // Tự gán mốc kinh tế
                     activeFilters.push(`Kinh tế (≤ 220k)`);
                 }
            }

            // 4. LỌC TỪ VỰNG RÁC CỰC MẠNH (Aggressive Stopwords)
            // Đã bổ sung "kh", "có", "tầm", "khoảng", "tài chính"...
            const stopwords = /\b(kh|khach|hang|co|va|cho|minh|tai|chinh|can|lap|muon|tim|goi|cuoc|gia|tien|kinh|te|re|nhat|tam|khoang|voi|o|de|nha|nhe|a|ah|oi|e|anh|em|tu|van|nay|do|vay|dang|ky|chi|da|thi)\b/gi;
            cleanQueryForText = cleanQueryForText.replace(stopwords, '').replace(/\s+/g, ' ').trim();

            // 5. ÁP DỤNG BỘ LỌC TỔNG HỢP VÀO DỮ LIỆU
            results = results.filter(pkg => {
                // Lọc theo bảng
                if (targetCategory && pkg.category !== targetCategory) return false;
                
                // Lọc theo ngân sách
                const price = pkg.price1M || 0;
                if (maxPrice !== null && (price === 0 || price > maxPrice)) return false;
                if (minPrice !== null && (price === 0 || price < minPrice)) return false;

                // Lọc IP (Chỉ dùng cho Doanh nghiệp)
                if (requireStaticIP && (!pkg.ipType || !removeAccents(pkg.ipType).includes("tinh"))) return false;
                if (requireDynamicIP && (!pkg.ipType || !removeAccents(pkg.ipType).includes("dong"))) return false;

                // Lọc Text Matching với các từ khóa CÒN SÓT LẠI sau khi đã dọn sạch rác
                const words = cleanQueryForText.split(/\s+/).filter(w => w.length > 0);
                if (words.length > 0) {
                    // Bơm thêm keyword ẩn để AI quét xuyên bảng thông minh hơn
                    let hiddenKeywords = "";
                    if (pkg.mesh1) hiddenKeywords += " mesh"; // Gói Fiber có hỗ trợ trang bị Mesh
                    if (pkg.category === 'hardware' && pkg.name.toLowerCase().includes('camera')) hiddenKeywords += " cam camera";
                    if (pkg.category === 'pack_cam') hiddenKeywords += " cam camera";

                    const targetStr = removeAccents(`${pkg.name} ${pkg.speed} ${pkg.service} ${pkg.searchTags} ${hiddenKeywords}`.toLowerCase());
                    
                    // Phải chứa tất cả các từ khóa hợp lệ còn lại
                    if (!words.every(w => targetStr.includes(w))) return false;
                }

                return true;
            });

            // 6. QUY TẮC SẮP XẾP VÀNG: Home/Cam ưu tiên lên trước, sau đó sắp xếp Giá từ thấp đến cao
            results.sort((a, b) => {
                const isHomeA = (a.category === 'home' || a.category === 'home_cam') ? 0 : 1;
                const isHomeB = (b.category === 'home' || b.category === 'home_cam') ? 0 : 1;
                
                if (isHomeA !== isHomeB) return isHomeA - isHomeB; 

                const priceA = a.price1M || 0;
                const priceB = b.price1M || 0;
                return priceA - priceB;
            });

            return {
                packages: results.slice(0, 16),
                filters: activeFilters,
                totalFound: results.length
            };
        };

        const PackageCard = ({ pkg }) => {
            const [copied, setCopied] = useState(false);

            const handleCopy = () => {
                let text = `📌 *${pkg.name}*\n`;
                if (pkg.speed) text += `▪ Tốc độ: ${pkg.speed}\n`;
                if (pkg.service) text += `▪ Dịch vụ: ${pkg.service}\n`;
                if (pkg.quantity) text += `▪ Thành phần: ${pkg.quantity}\n`;
                if (pkg.ipType) text += `▪ IP: ${pkg.ipType}\n`;
                if (pkg.price1M && formatDisplayPrice(pkg.price1M) !== "Liên hệ") text += `💰 Giá 1 Tháng: ${formatDisplayPrice(pkg.price1M)}\n`;
                if (pkg.mesh1) text += `▪ Kèm 1 Mesh 6: ${formatDisplayPrice(pkg.mesh1)}\n`;

                const el = document.createElement('textarea');
                el.value = text;
                document.body.appendChild(el);
                el.select();
                document.execCommand('copy');
                document.body.removeChild(el);
                
                setCopied(true);
                setTimeout(() => setCopied(false), 2000);
            };

            let theme = { bg: 'bg-blue-600', text: 'HOME / FIBER', icon: 'fa-wifi', border: 'border-blue-100' };
            if (pkg.category === 'dn') theme = { bg: 'bg-purple-600', text: 'DOANH NGHIỆP', icon: 'fa-building', border: 'border-purple-100' };
            if (pkg.category === 'mesh') theme = { bg: 'bg-emerald-500', text: 'PACK MESH', icon: 'fa-router', border: 'border-emerald-100' };
            if (pkg.category === 'pack_cam') theme = { bg: 'bg-sky-500', text: 'PACK CAMERA', icon: 'fa-cloud', border: 'border-sky-100' };
            if (pkg.category === 'home_cam') theme = { bg: 'bg-amber-500', text: 'HOME CAM', icon: 'fa-video', border: 'border-amber-100' };
            if (pkg.category === 'hardware') theme = { bg: 'bg-rose-500', text: 'MUA THIẾT BỊ', icon: 'fa-box-open', border: 'border-rose-100' };

            return (
                <div className={`bg-white border ${theme.border} rounded-2xl overflow-hidden shadow-sm hover:shadow-xl transition-all flex flex-col h-full w-full snap-center shrink-0`} style={{ width: '280px' }}>
                    <div className="bg-slate-50 px-4 py-3 border-b border-gray-100">
                        <div className="flex justify-between items-center mb-1.5">
                            <span className={`${theme.bg} text-white text-[10px] font-bold px-2 py-0.5 rounded uppercase tracking-wider flex items-center gap-1`}>
                                <i className={`fas ${theme.icon}`}></i> {theme.text}
                            </span>
                            {pkg.ipType && <span className="text-[10px] bg-gray-200 text-gray-700 px-1.5 py-0.5 rounded font-semibold">{pkg.ipType}</span>}
                        </div>
                        <h3 className="font-extrabold text-gray-900 uppercase text-[15px] leading-tight" title={pkg.name}>{pkg.name}</h3>
                    </div>

                    <div className="p-4 flex-grow flex flex-col gap-3 bg-white">
                        <div className="text-[13px] text-gray-600 space-y-2 flex-grow">
                            {pkg.speed && <div className="flex gap-2"><i className="fas fa-gauge-high text-gray-400 mt-1"></i> <span><span className="font-semibold text-gray-800">{pkg.speed}</span></span></div>}
                            {pkg.service && <div className="flex gap-2"><i className="fas fa-layer-group text-gray-400 mt-1"></i> <span className="font-medium text-gray-800">{pkg.service}</span></div>}
                            {pkg.quantity && <div className="flex gap-2"><i className="fas fa-box text-gray-400 mt-1"></i> <span className="font-medium text-gray-800">{pkg.quantity}</span></div>}
                        </div>

                        <div className="mt-auto space-y-2 pt-2 border-t border-gray-50">
                            <div className="bg-blue-50/50 rounded-xl p-3 text-center">
                                <div className="text-[10px] font-bold uppercase text-blue-600 mb-0.5">
                                    {pkg.category === 'hardware' ? 'GIÁ BÁN (MUA 1 LẦN)' : 'GIÁ 1 THÁNG GỐC'}
                                </div>
                                <div className="font-black text-2xl text-blue-900">{formatDisplayPrice(pkg.price1M)}</div>
                            </div>

                            {/* Gợi ý trả trước */}
                            {(pkg.price3M || pkg.price6M || pkg.price12M) && (
                                <div className="flex justify-center flex-wrap gap-1.5 mt-2">
                                    {pkg.price3M && <span className="bg-white border border-blue-200 text-blue-700 px-1.5 py-0.5 rounded text-[11px] font-bold">3T: {formatDisplayPrice(pkg.price3M)}</span>}
                                    {pkg.price6M && <span className="bg-white border border-emerald-200 text-emerald-700 px-1.5 py-0.5 rounded text-[11px] font-bold">6T: {formatDisplayPrice(pkg.price6M)}</span>}
                                    {pkg.price12M && <span className="bg-white border border-purple-200 text-purple-700 px-1.5 py-0.5 rounded text-[11px] font-bold">12T: {formatDisplayPrice(pkg.price12M)}</span>}
                                </div>
                            )}
                        </div>

                        <button 
                            onClick={handleCopy}
                            className={`mt-2 w-full py-2.5 rounded-xl text-[13px] font-bold transition-all flex items-center justify-center gap-2 ${
                                copied ? 'bg-green-500 text-white shadow-md' : 'bg-slate-800 text-white hover:bg-blue-600 shadow'
                            }`}
                        >
                            {copied ? <><i className="fas fa-check"></i> Đã chép</> : <><i className="far fa-copy"></i> Copy gửi Zalo</>}
                        </button>
                    </div>
                </div>
            );
        };

        const App = () => {
            const [inputValue, setInputValue] = useState('');
            const [isTyping, setIsTyping] = useState(false);

            // Bổ sung kho gợi ý phong phú và tự động sắp xếp Alphabet (A-Z)
            const initialSuggestions = [
                'Cam dưới 250k',
                'Doanh Nghiệp dưới 1 triệu',
                'Doanh Nghiệp dưới 500k',
                'Doanh Nghiệp IP Động',
                'Doanh Nghiệp IP Tĩnh',
                'Fiber dưới 200k',
                'Gói cước Fiber dưới 300k',
                'Home Cam',
                'Home Slay',
                'Home TV',
                'Mesh dưới 100k',
                'Mua Thiết Bị',
                'Pack Cam',
                'Pack Mesh'
            ].sort((a, b) => a.localeCompare(b, 'vi'));

            const [messages, setMessages] = useState([
                {
                    id: 1, type: 'bot', 
                    text: '👋 **Trợ lý AI Smart VNPT đã sẵn sàng.**\n\n- Tôi đã được nâng cấp NLU: hiểu giá tiền (*"dưới 200k"*), hiểu kỹ thuật (*"ip tĩnh / động"*).\n- Tự động lược bỏ từ thừa (*khách, có, và, muốn...*).\n- Gói **Home** và **Giá rẻ** luôn ưu tiên hiển thị trước.',
                    suggestions: initialSuggestions
                }
            ]);
            const messagesEndRef = useRef(null);

            useEffect(() => {
                messagesEndRef.current?.scrollIntoView({ behavior: 'smooth' });
            }, [messages, isTyping]);

            const handleSearch = (query) => {
                if (!query.trim()) return;

                setMessages(prev => [...prev, { id: Date.now(), type: 'user', text: query }]);
                setInputValue('');
                setIsTyping(true);

                setTimeout(() => {
                    const result = smartAIQuery(query);
                    setIsTyping(false);

                    let botText = "";
                    if (result.totalFound > 0) {
                        const maxShow = Math.min(result.totalFound, 16);
                        botText = `✅ **Tìm thấy ${result.totalFound} kết quả** (Hiển thị tối đa ${maxShow} gói).`;
                        if (result.filters.length > 0) {
                            botText += `\n🎯 Đã áp dụng AI lọc: *${result.filters.join(", ")}*`;
                        }
                        
                        setMessages(prev => [...prev, {
                            id: Date.now(), type: 'bot',
                            text: botText,
                            packages: result.packages
                        }]);
                    } else {
                        setMessages(prev => [...prev, {
                            id: Date.now(), type: 'bot',
                            text: `❌ Không tìm thấy gói cước nào khớp với yêu cầu "${query}".\nHãy thử đổi từ khóa hoặc nới lỏng mức giá nhé!`,
                            suggestions: ['Fiber dưới 200k', 'Doanh Nghiệp IP Tĩnh', 'Home Cam', 'Pack Mesh']
                        }]);
                    }
                }, 400); // Simulate AI thought process
            };

            return (
                <div className="w-full h-full flex flex-col relative bg-slate-50">
                    {/* Header */}
                    <div className="bg-gradient-to-r from-blue-700 via-blue-600 to-indigo-700 p-4 flex items-center justify-between z-10 shadow-md shrink-0">
                        <div className="flex items-center gap-3">
                            <div className="w-10 h-10 bg-white rounded-full flex items-center justify-center p-1.5 shadow-inner">
                                <img src="https://upload.wikimedia.org/wikipedia/commons/thumb/e/e9/VNPT_Logo.svg/2048px-VNPT_Logo.svg.png" className="w-full h-full object-contain" alt="VNPT" />
                            </div>
                            <div>
                                <h1 className="font-bold text-white text-[15px] uppercase tracking-wider flex items-center gap-1.5">
                                    Smart AI VNPT <i className="fas fa-bolt text-yellow-400 text-xs"></i>
                                </h1>
                                <p className="text-[10px] text-blue-100 flex items-center gap-1 mt-0.5">
                                    <span className="w-1.5 h-1.5 bg-green-400 rounded-full animate-pulse"></span> NLU Engine Active • Strict Table Routing
                                </p>
                            </div>
                        </div>
                    </div>

                    {/* Chat Area */}
                    <div className="flex-grow p-4 overflow-y-auto custom-scrollbar flex flex-col gap-5" style={{ backgroundImage: 'radial-gradient(#cbd5e1 1px, transparent 1px)', backgroundSize: '20px 20px' }}>
                        {messages.map((msg) => (
                            <div key={msg.id} className={`flex w-full ${msg.type === 'user' ? 'justify-end' : 'justify-start'} animate-fade-in-up`}>
                                {msg.type === 'bot' && (
                                    <div className="w-8 h-8 rounded-full bg-blue-100 flex items-center justify-center mr-3 shrink-0 mt-1 border border-blue-200 shadow-sm">
                                        <i className="fas fa-robot text-blue-600 text-sm"></i>
                                    </div>
                                )}
                                <div className={`max-w-[95%] sm:max-w-[85%] flex flex-col ${msg.type === 'user' ? 'items-end' : 'items-start'}`}>
                                    {msg.text && (
                                        <div className={`px-4 py-3 text-[14px] leading-relaxed shadow-sm ${msg.type === 'user' ? 'bg-blue-600 text-white rounded-2xl rounded-tr-sm font-medium' : 'bg-white text-gray-800 border border-gray-100 rounded-2xl rounded-tl-sm'}`} 
                                             dangerouslySetInnerHTML={{ __html: msg.text.replace(/\n/g, '<br/>') }} />
                                    )}

                                    {msg.suggestions && (
                                        <div className="mt-2.5 flex flex-wrap gap-2">
                                            {msg.suggestions.map((sug, i) => (
                                                <button key={i} onClick={() => handleSearch(sug)}
                                                    className="bg-white border border-blue-200 text-blue-700 font-medium text-[12px] px-3 py-1.5 rounded-full hover:bg-blue-50 transition-colors shadow-sm active:scale-95">
                                                    {sug}
                                                </button>
                                            ))}
                                        </div>
                                    )}

                                    {msg.packages && (
                                        <div className="mt-3 w-full max-w-[calc(100vw-3rem)] sm:max-w-[calc(100vw-6rem)]">
                                            <div className="carousel-scroll">
                                                {msg.packages.map(pkg => (
                                                    <PackageCard key={pkg.id} pkg={pkg} />
                                                ))}
                                            </div>
                                            <div className="text-center mt-2 text-[11px] text-gray-500 font-medium flex justify-center items-center gap-1 opacity-70">
                                                <i className="fas fa-arrows-left-right"></i> Kéo thanh trượt để xem thêm
                                            </div>
                                        </div>
                                    )}
                                </div>
                            </div>
                        ))}
                        
                        {isTyping && (
                            <div className="flex w-full justify-start animate-fade-in-up">
                                <div className="w-8 h-8 rounded-full bg-blue-100 flex items-center justify-center mr-3 border border-blue-200">
                                    <i className="fas fa-robot text-blue-600 text-sm"></i>
                                </div>
                                <div className="bg-white border border-gray-100 px-4 py-3 rounded-2xl rounded-tl-sm shadow-sm flex items-center gap-2">
                                    <span className="w-2 h-2 bg-blue-400 rounded-full animate-bounce" style={{ animationDelay: '0ms' }}></span>
                                    <span className="w-2 h-2 bg-blue-400 rounded-full animate-bounce" style={{ animationDelay: '150ms' }}></span>
                                    <span className="w-2 h-2 bg-blue-400 rounded-full animate-bounce" style={{ animationDelay: '300ms' }}></span>
                                </div>
                            </div>
                        )}
                        <div ref={messagesEndRef} className="h-4" />
                    </div>

                    {/* Input Area */}
                    <div className="p-3 bg-white border-t border-gray-200 shadow-[0_-5px_15px_-3px_rgba(0,0,0,0.05)] shrink-0">
                        <div className="flex items-center gap-2 rounded-2xl p-1.5 bg-gray-50 border border-gray-300 focus-within:border-blue-500 focus-within:bg-white focus-within:ring-2 focus-within:ring-blue-100 transition-all">
                            <i className="fas fa-sparkles ml-3 text-blue-500"></i>
                            <input
                                type="text"
                                value={inputValue}
                                onChange={(e) => setInputValue(e.target.value)}
                                onKeyPress={(e) => e.key === 'Enter' && handleSearch(inputValue)}
                                placeholder="VD: Doanh nghiệp IP tĩnh, Fiber dưới 200k, Home Cam..."
                                className="flex-grow bg-transparent border-none outline-none text-[14px] text-gray-800 placeholder-gray-400 py-2.5 w-full font-medium"
                            />
                            <button 
                                onClick={() => handleSearch(inputValue)}
                                disabled={!inputValue.trim()}
                                className="w-11 h-11 rounded-xl bg-blue-600 text-white flex items-center justify-center disabled:bg-gray-300 disabled:shadow-none transition-all shadow-md active:scale-95 shrink-0"
                            >
                                <i className="fas fa-paper-plane ml-[-2px]"></i>
                            </button>
                        </div>
                    </div>
                </div>
            );
        };

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
