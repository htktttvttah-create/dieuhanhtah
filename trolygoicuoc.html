        try { finish(null, rowsFromQueryResponse(payload)); }
        catch (e) { finish(e); }
      };
      script.onerror = function () { finish(new Error('không tải được script Google')); };
      script.src = rangeUrl(range, cb);
      document.head.appendChild(script);
    });
  }

  async function loadRange(range) {
    try {
      const res = await fetch(rangeUrl(range), { mode: 'cors', cache: 'no-store' });
      if (!res.ok) throw new Error('HTTP ' + res.status);
      const text = await res.text();
      const rows = rowsFromGviz(text);
      if (!rows.length) throw new Error('rỗng');
      return rows;
    } catch (e) {
      // file:// hoặc khi bị CORS: dùng JSONP để vẫn lấy được giá mới
      return loadRangeJsonp(range);
    }
  }

  async function loadLive() {
    const keys = TABLE_DEFS.filter(function (d) { return RANGES[d.key]; }).map(function (d) { return d.key; });
    if (!keys.length) throw new Error('chưa cấu hình vùng dữ liệu');
    const fetched = await Promise.all(keys.map(function (k) {
      return loadRange(RANGES[k]).then(function (rows) {
        return { key: k, rows: rows };
      }).catch(function () {
        return { key: k, rows: null };
      });
    }));
    const blocks = {};
    fetched.forEach(function (f) { if (f.rows) blocks[f.key] = f.rows; });
    if (!Object.keys(blocks).length) throw new Error('không lấy được dữ liệu nào');

    const parsed = parseTables(blocks);
    const failed = [];
    const merged = parsed.map(function (t) {
      const current = byKey[t.key];
      const expected = current ? (current.packages || []).length : 0;
      // Bảng đọc lỗi, hoặc số gói sụt quá nhiều (sheet đổi cấu trúc) -> giữ bản đang dùng
      const broken = !t.packages.length || (expected > 0 && t.packages.length < expected * 0.5);
      if (broken) {
        failed.push(t.key);
        return current || t;
      }
      return t;
    });
    return { tables: merged, failed: failed, at: new Date() };
  }

  /* ---------------- truy vấn ---------------- */
  const COMPONENT_PATTERNS = {
    fiber: /\b(fiber|internet|cap quang|duong truyen)\b/g,
    mesh: /\b(mesh|m8tt|mstt)\b/g,
    cam: /\b(cam|camera|giam sat|cloud)\b/g,
    mytv: /\b(mytv|truyen hinh|tivi|tv|box|dau thu)\b/g,
  };

  const STOPWORDS = new Set(('kh khach hang co va cho minh tai chinh can lap muon tim goi cuoc gia tien kinh te ' +
    'nhat tam khoang voi o de nha nhe a ah oi e anh em tu van nay do vay dang ky chi da thi la bao nhieu ' +
    'the nao cua mot giup ho tro nhu the loai nao gom chua kem ket hop cung').split(/\s+/));

  function toVnd(numStr, unit) {
    const raw = String(numStr).trim();
    let n;
    if (/^\d{1,3}([.,]\d{3})+$/.test(raw)) n = parseInt(raw.replace(/[.,]/g, ''), 10);
    else n = parseFloat(raw.replace(',', '.'));
    if (!isFinite(n) || isNaN(n)) return null;
    if (unit) {
      if (/trieu|tr/.test(unit)) return Math.round(n * 1000000);
      if (/k|nghin|ngan|000/.test(unit)) return Math.round(n * 1000);
    }
    if (n >= 1000) return Math.round(n);
    if (n >= 10) return Math.round(n * 1000);
    return null;
  }

  function formatPrice(v) {
    if (v == null || isNaN(v)) return 'Liên hệ';
    return Math.round(v).toLocaleString('vi-VN') + 'đ';
  }

  function parseQuery(raw) {
    let s = ' ' + norm(raw || '') + ' ';
    const filters = [];
    let speedMin = null, maxPrice = null, minPrice = null,
        requireStaticIP = false, requireDynamicIP = false,
        audience = null, onceOnly = false, cheapMode = false,
        comboMode = false, minComponents = null;

    // --- tốc độ (300mb / 300 mbps / 1gbps / 1 gb)
    s = s.replace(/(\d+(?:[.,]\d+)?)\s*(gbps|gb)(?![a-z])/g, function (m, n) {
      speedMin = Math.max(speedMin || 0, Math.round(parseFloat(n.replace(',', '.')) * 1000));
      return ' ';
    });
    s = s.replace(/(\d+)\s*(mbps|mb)(?![a-z])/g, function (m, n) {
      speedMin = Math.max(speedMin || 0, parseInt(n, 10));
      return ' ';
    });
    if (speedMin) filters.push('Tốc độ ≥ ' + (speedMin >= 1000 ? (speedMin / 1000) + ' Gbps' : speedMin + ' Mbps'));

    // --- ngân sách
    const money = '(\\d[\\d.,]*)\\s*(trieu|tr|k|nghin|ngan|000)?';
    let m = s.match(new RegExp('(?:duoi|nho hon|be hon|khong qua|toi da|under|<=?)\\s*' + money));
    if (m) {
      const v = toVnd(m[1], m[2]);
      if (v) { maxPrice = v; filters.push('Giá ≤ ' + formatPrice(v)); s = s.replace(m[0], ' '); }
    }
    m = s.match(new RegExp('(?:tren|lon hon|cao hon|over|>=?)\\s*' + money));
    if (m) {
      const v = toVnd(m[1], m[2]);
      if (v) { minPrice = v; filters.push('Giá ≥ ' + formatPrice(v)); s = s.replace(m[0], ' '); }
    }
    if (maxPrice == null && minPrice == null) {
      const im = s.match(/(?:^|\s)(\d{2,})(\s*(?:k|nghin|ngan))?(?=\s|$)/);
      if (im) {
        const v = im[2] ? parseInt(im[1], 10) * 1000 : toVnd(im[1], null);
        if (v) { maxPrice = v; filters.push('Ngân sách ≤ ' + formatPrice(v)); s = s.replace(im[0], ' '); }
      }
    }

    // --- IP tĩnh / động
    if (/\btinh\b/.test(s) && /\b(ip|wan|lan)\b/.test(s)) {
      requireStaticIP = true;
      filters.push('IP tĩnh');
      s = s.replace(/\b(ip|wan|lan)\b|\btinh\b/g, ' ');
    } else if (/\bdong\b/.test(s) && /\b(ip|wan)\b/.test(s)) {
      requireDynamicIP = true;
      filters.push('IP động');
      s = s.replace(/\b(ip|wan)\b|\bdong\b/g, ' ');
    }

    // --- đối tượng khách hàng
    if (/\b(doanh nghiep|cong ty|khdn|dn|business)\b/.test(s)) {
      audience = 'business';
      filters.push('Khách hàng doanh nghiệp');
      s = s.replace(/\b(doanh nghiep|cong ty|khdn|dn|business)\b/g, ' ');
    } else if (/\b(ca nhan|gia dinh|ho gia dinh|khcn|sinh vien)\b/.test(s)) {
      audience = 'personal';
      filters.push('Khách hàng cá nhân');
      s = s.replace(/\b(ca nhan|gia dinh|ho gia dinh|khcn|sinh vien)\b/g, ' ');
    }

    // --- mua luôn (1 lần)
    const onceRe = /\b(mua luon|mua 1 lan|mua mot lan|mua dut|mua thiet bi|mua rieng|mua)\b/g;
    if (onceRe.test(s)) {
      onceOnly = true;
      filters.push('Mua thiết bị 1 lần');
      s = s.replace(onceRe, ' ');
    }

    // --- ưu tiên giá thấp / gói tích hợp
    const cheapRe = /\b(re nhat|re|gia re|kinh te|tiet kiem|thap nhat)\b/g;
    if (cheapRe.test(s)) {
      cheapMode = true;
      filters.push('Ưu tiên giá thấp');
      s = s.replace(cheapRe, ' ');
    }
    const comboRe = /\b(tich hop|combo|tron goi|full)\b/g;
    if (comboRe.test(s)) {
      comboMode = true;
      filters.push('Ưu tiên gói tích hợp');
      s = s.replace(comboRe, ' ');
    }

    // --- thành phần (fiber / mesh / cam / mytv)
    const comps = [];
    COMPONENT_ORDER.forEach(function (key) {
      const re = new RegExp(COMPONENT_PATTERNS[key].source, 'g');
      if (re.test(s)) {
        comps.push(key);
        s = s.replace(re, ' ');
      }
    });

    // --- từ khóa còn lại
    s = s.replace(/[^a-z0-9\s]/g, ' ').replace(/\s+/g, ' ').trim();
    const terms = [];
    s.split(' ').forEach(function (w) {
      if (!w || STOPWORDS.has(w) || terms.indexOf(w) !== -1) return;
      // bỏ ký tự đơn lẻ (vd 'b' trong "HOME 1_B") để không khớp tràn lan; vẫn giữ số đơn như '1'
      if (w.length < 2 && !/^\d$/.test(w)) return;
      terms.push(w);
    });

    if (comboMode && comps.length === 0) minComponents = 2;

    const labelParts = comps.map(function (c) { return COMPONENTS[c].label; })
      .concat(terms.map(function (t) { return '"' + t + '"'; }));
    if (labelParts.length) filters.unshift('Thành phần: ' + labelParts.join(' + '));

    return {
      raw: raw || '', comps: comps, terms: terms,
      phrase: terms.length >= 2 ? terms.join(' ') : '',
      filters: filters,
      speedMin: speedMin, maxPrice: maxPrice, minPrice: minPrice,
      requireStaticIP: requireStaticIP, requireDynamicIP: requireDynamicIP,
      audience: audience, onceOnly: onceOnly, cheapMode: cheapMode,
      minComponents: minComponents, tableKey: null,
    };
  }

  function sortPackages(list, cheapMode) {
    const price = function (p) { return p.price == null ? Number.POSITIVE_INFINITY : p.price; };
    // Nhóm ưu tiên: 0 = gói tích hợp (từ 2 dịch vụ trở lên), 1 = gói lẻ
    const tier = function (p) { return componentCount(p) >= 2 ? 0 : 1; };
    return list.slice().sort(function (a, b) {
      if (cheapMode) {
        // Người dùng yêu cầu rẻ nhất: giá thấp trước, cùng giá thì gói tích hợp trước
        const d = price(a) - price(b);
        if (d) return d;
        const t = tier(a) - tier(b);
        if (t) return t;
      } else {
        // 1) gói tích hợp lên trước  2) giá thấp nhất lên trước
        const t = tier(a) - tier(b);
        if (t) return t;
        const d = price(a) - price(b);
        if (d) return d;
      }
      const c = componentCount(b) - componentCount(a);
      if (c) return c;
      return a.name.localeCompare(b.name, 'vi');
    });
  }

  function search(q) {
    const comps = q.comps || [];
    const terms = q.terms || [];
    // Khi người dùng chỉ nêu đối tượng (vd "doanh nghiệp") thì chỉ lấy đúng bảng của đối tượng đó;
    // các bảng dùng chung (Pack Mesh/Camera, Mua luôn) chỉ xuất hiện khi có thêm thành phần/nhu cầu cụ thể.
    const hasFocus = comps.length > 0 || terms.length > 0 || !!q.onceOnly || !!q.minComponents;
    const matched = packages.filter(function (p) {
      if (comps.length && !comps.every(function (c) { return p.components.indexOf(c) !== -1; })) return false;
      if (q.minComponents && componentCount(p) < q.minComponents) return false;
      if (q.tableKey && p.tableKey !== q.tableKey) return false;
      if (q.onceOnly && p.unit !== 'once') return false;
      if (q.maxPrice != null && (p.price == null || p.price > q.maxPrice)) return false;
      if (q.minPrice != null && (p.price == null || p.price < q.minPrice)) return false;
      if (q.speedMin != null && !(p.speedMbps != null && p.speedMbps >= q.speedMin)) return false;
      if (q.requireStaticIP && !/tinh/.test(norm(p.ip))) return false;
      if (q.requireDynamicIP && !/dong/.test(norm(p.ip))) return false;
      if (q.audience) {
        if (p.audience === q.audience) { /* đúng đối tượng */ }
        else if (p.audience === 'both' && hasFocus) { /* bảng dùng chung: chỉ khi đã có tiêu chí cụ thể */ }
        else return false;
      }
      if (terms.length) {
        for (let i = 0; i < terms.length; i++) {
          const t = terms[i];
          // số (vd "1") phải khớp nguyên từ, tránh "1" dính trong "tv1", "eco1"
          if (/^\d+$/.test(t)) {
            if (p._tokens.indexOf(t) === -1) return false;
          } else if (p._hay.indexOf(t) === -1) {
            return false;
          }
        }
      }
      return true;
    });

    let list = matched;
    if (q.phrase) {
      const byName = list.filter(function (p) { return norm(p.name).indexOf(q.phrase) !== -1; });
      if (byName.length) list = byName;
    }

    const sorted = sortPackages(list, !!q.cheapMode);

    // Nhóm theo bảng (bảng nào có gói xếp hạng cao nhất thì đứng trước)
    const groups = [];
    const seen = {};
    sorted.forEach(function (p) {
      if (!seen[p.tableKey]) {
        seen[p.tableKey] = { table: byKey[p.tableKey] || { key: p.tableKey, short: p.tableShort, color: 'blue', icon: 'fa-table' }, packages: [] };
        groups.push(seen[p.tableKey]);
      }
      seen[p.tableKey].packages.push(p);
    });

    return {
      groups: groups, total: sorted.length, packages: sorted,
      filters: q.filters || [], cheapMode: !!q.cheapMode,
    };
  }

  // Nếu từ khóa chữ làm rỗng kết quả thì tự nới lỏng, chỉ giữ thành phần/điều kiện
  function searchSmart(q) {
    const res = search(q);
    const hasFacet = (q.comps || []).length > 0 || q.audience || q.maxPrice != null ||
      q.minPrice != null || q.speedMin != null || q.onceOnly || q.minComponents;
    if (res.total === 0 && (q.terms || []).length && hasFacet) {
      const relaxed = search(Object.assign({}, q, { terms: [], filters: (q.filters || []).filter(function (f) { return !/^Thành phần:/.test(f); }) }));
      if (relaxed.total) {
        relaxed.relaxed = true;
        relaxed.droppedTerms = q.terms.slice();
        return relaxed;
      }
    }
    return res;
  }

  window.VNPT_ENGINE = {
    META: META,
    COMPONENTS: COMPONENTS, COMPONENT_ORDER: COMPONENT_ORDER, TABLE_DEFS: TABLE_DEFS,
    RANGES: RANGES,
    getTables: getTables, getPackages: getPackages, getTable: getTable, applyTables: applyTables,
    parseTables: parseTables, loadLive: loadLive, loadRange: loadRange,
    norm: norm, parseQuery: parseQuery, search: search, searchSmart: searchSmart,
    sortPackages: sortPackages, formatPrice: formatPrice, componentCount: componentCount,
    signature: signature, num: num, cellText: cellText, cellName: cellName,
  };
})();
/* === ENGINE END === */
</script>

            <span className="font-medium text-slate-800">{pkg.quantity}</span>
          </div>
        )}
        {pkg.ip && (
          <div className="flex gap-1.5">
            <i className="fas fa-network-wired text-slate-300 mt-[3px] text-[10px]"></i>
            <span>{pkg.ip}</span>
          </div>
        )}
        {pkg.note && <div className="text-[10px] text-slate-400 italic">{pkg.note}</div>}
      </div>

      <div className="px-3 pb-3">
        <div className="rounded-xl bg-slate-50 border border-slate-100 py-1.5 text-center">
          <div className="text-[8.5px] font-bold uppercase tracking-wide text-slate-400">
            {isOnce ? 'Giá mua 1 lần' : 'Giá 1 tháng'}
          </div>
          <div className="font-black text-[19px] leading-tight text-blue-900">{formatPrice(pkg.price)}</div>
        </div>

        {(pkg.periods || []).length > 0 && (
          <div className="flex flex-wrap gap-1 mt-1.5">
            {pkg.periods.map((t) => (
              <span key={t.label} className="bg-white border border-slate-200 text-slate-600 px-1.5 py-[1px] rounded text-[9.5px] font-semibold">
                {t.label}: {formatPrice(t.price)}
              </span>
            ))}
          </div>
        )}

        <button
          onClick={handleCopy}
          className={`mt-2 w-full py-1.5 rounded-lg text-[11px] font-bold flex items-center justify-center gap-1.5 transition-all ${
            copied ? 'bg-green-500 text-white' : 'bg-slate-800 text-white hover:bg-blue-600'
          }`}
        >
          {copied ? <><i className="fas fa-check"></i> Đã chép</> : <><i className="far fa-copy"></i> Copy gửi Zalo</>}
        </button>
      </div>
    </div>
  );
};

/* ---------- nhóm kết quả theo 1 bảng trong sheet ---------- */
const GroupSection = ({ group, onShowTable }) => {
  const [expanded, setExpanded] = useState(false);
  const LIMIT = 6;
  const theme = TABLE_THEME[group.table.color] || TABLE_THEME.blue;
  const list = expanded ? group.packages : group.packages.slice(0, LIMIT);
  const hidden = group.packages.length - list.length;
  const notes = group.table.notes || [];

  return (
    <div className="border border-slate-200 rounded-2xl bg-white/70 overflow-hidden">
      <div className="flex items-center justify-between gap-2 px-3 py-2 bg-slate-50 border-b border-slate-200">
        <div className="flex items-center gap-2 min-w-0">
          <span className={`w-6 h-6 rounded-lg ${theme.bar} text-white text-[10px] flex items-center justify-center shrink-0`}>
            <i className={`fas ${group.table.icon}`}></i>
          </span>
          <div className="min-w-0">
            <div className="text-[11.5px] font-extrabold uppercase tracking-wide text-slate-700 truncate" title={group.table.title}>
              {group.table.short}
            </div>
            <div className="text-[9.5px] text-slate-400 truncate">
              {group.packages.length} gói khớp{notes.length ? ' · ' + notes[0] : ''}
            </div>
          </div>
        </div>
        <button onClick={() => onShowTable(group.table.key)}
          className="text-[10px] font-bold text-blue-600 hover:text-blue-800 whitespace-nowrap shrink-0">
          Cả bảng <i className="fas fa-arrow-right text-[8px]"></i>
        </button>
      </div>

      <div className="p-2.5">
        <div className="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 gap-2.5">
          {list.map((p) => <PackageCard key={p.id} pkg={p} />)}
        </div>
        {(hidden > 0 || expanded) && (
          <button onClick={() => setExpanded(!expanded)}
            className="mt-2.5 w-full py-1.5 rounded-lg border border-dashed border-slate-300 text-[11px] font-bold text-slate-500 hover:bg-slate-50 hover:text-blue-600">
            {expanded ? 'Thu gọn' : `Xem thêm ${hidden} gói cùng bảng`}
          </button>
        )}
      </div>
    </div>
  );
};

/* ---------- khối kết quả ---------- */
const ResultPanel = ({ result, onShowTable }) => {
  if (!result.packages.length) {
    return (
      <div className="mt-3 rounded-2xl border border-dashed border-amber-300 bg-amber-50 p-3 text-[12px] text-amber-800">
        <b>Không tìm thấy gói phù hợp.</b> Thử bỏ bớt điều kiện, hoặc chọn nhanh một thành phần bên dưới.
      </div>
    );
  }
  return (
    <div className="mt-3 space-y-3">
      {result.groups.map((g) => <GroupSection key={g.table.key} group={g} onShowTable={onShowTable} />)}
    </div>
  );
};

/* ---------- ứng dụng ---------- */
const App = () => {
  const [inputValue, setInputValue] = useState('');
  const [isTyping, setIsTyping] = useState(false);
  const [messages, setMessages] = useState([
    { id: 1, type: 'bot', welcome: true, suggestions: SUGGESTION_POOL },
  ]);
  const [sync, setSync] = useState({ mode: 'snapshot', at: ENGINE.META.generatedAt || '', failed: [] });
  const [syncing, setSyncing] = useState(false);

  const messagesEndRef = useRef(null);
  const lastResultRef = useRef(null);
  const chatRef = useRef(null);
  const contentRef = useRef(null);
  const pendingScrollRef = useRef(null);
  const idRef = useRef(10);
  const syncRef = useRef(false);
  const [, forceRender] = useState(0);

  const nextId = () => ++idRef.current;

  const welcomeText = () => {
    const tbls = ENGINE.getTables();
    const total = ENGINE.getPackages().length;
    return `👋 **Trợ lý gói cước VNPT** đã sẵn sàng.\n\nTôi đọc **${tbls.length} bảng giá** từ Google Sheet (${total} gói). Bạn chỉ cần nêu **thành phần** muốn dùng — **Fiber**, **Mesh**, **Camera**, **MyTV** — hoặc nói nhu cầu kèm mức giá.\n\n🎯 Kết quả luôn xếp: **gói tích hợp nhiều dịch vụ lên đầu**, cùng nhóm thì **giá thấp nhất trước**.`;
  };

  const alignTop = (el) => {
    const scroller = chatRef.current;
    if (!scroller || !el) return;
    scroller.scrollTop += el.getBoundingClientRect().top - scroller.getBoundingClientRect().top - 34;
  };

  useEffect(() => {
    const scroller = chatRef.current;
    if (!scroller) return;
    const last = messages[messages.length - 1];
    if (last && last.type === 'bot' && last.result && lastResultRef.current) {
      pendingScrollRef.current = lastResultRef.current;
      alignTop(lastResultRef.current);
    } else {
      pendingScrollRef.current = null;
      scroller.scrollTop = scroller.scrollHeight;
    }
  }, [messages, isTyping]);

  useEffect(() => {
    const target = contentRef.current;
    if (!target || typeof ResizeObserver === 'undefined') return;
    const ro = new ResizeObserver(() => { alignTop(pendingScrollRef.current); });
    ro.observe(target);
    const stop = () => { pendingScrollRef.current = null; };
    window.addEventListener('wheel', stop, { passive: true });
    window.addEventListener('touchstart', stop, { passive: true });
    return () => {
      ro.disconnect();
      window.removeEventListener('wheel', stop);
      window.removeEventListener('touchstart', stop);
    };
  }, []);

  /* ---------- đồng bộ giá từ Google Sheet ---------- */
  const pushBotNote = (text, extra) => {
    setMessages((prev) => prev.concat(Object.assign({ id: nextId(), type: 'bot', text: text }, extra || {})));
  };

  const refreshPrices = async (silent) => {
    if (syncRef.current) return;
    syncRef.current = true;
    setSyncing(true);
    const beforeSig = ENGINE.signature();
    const beforePrice = {};
    ENGINE.getPackages().forEach((p) => { beforePrice[p.id] = p.price; });

    try {
      const res = await ENGINE.loadLive();
      ENGINE.applyTables(res.tables);
      forceRender((v) => v + 1);
      const at = formatTime(res.at);
      setSync({ mode: 'live', at: at, failed: res.failed || [] });

      let changed = 0;
      ENGINE.getPackages().forEach((p) => {
        if (Object.prototype.hasOwnProperty.call(beforePrice, p.id) && beforePrice[p.id] !== p.price) changed++;
      });
      const isFirstSync = beforeSig === '' || Object.keys(beforePrice).length === 0;
      if (!isFirstSync && changed > 0) {
        // luôn báo khi giá đổi (kể cả tự động cập nhật), để người dùng không đọc nhầm giá cũ
        pushBotNote(`🔄 **Đã cập nhật giá mới từ Google Sheet** lúc ${at} — **${changed} gói** thay đổi giá.`);
      } else if (!silent && !isFirstSync) {
        pushBotNote(`✅ Đã kiểm tra Google Sheet lúc ${at} — giá đang là mới nhất, không có thay đổi.`);
      }
      if (res.failed && res.failed.length && !silent) {
        pushBotNote(`⚠️ ${res.failed.length} bảng chưa đọc được (sheet đổi cấu trúc?) nên đang dùng bản lưu sẵn.`);
      }
    } catch (e) {
      if (!silent) {
        pushBotNote('⚠️ Chưa kết nối được Google Sheet (mạng/CORS). Ứng dụng vẫn dùng **bản lưu sẵn** — bấm nút cạnh tiêu đề để thử lại.');
      }
      setSync((s) => ({ mode: s.mode === 'live' ? 'live' : 'snapshot', at: s.at, failed: s.failed }));
    } finally {
      setSyncing(false);
      syncRef.current = false;
    }
  };

  useEffect(() => {
    refreshPrices(true);
    const timer = setInterval(() => {
      if (!document.hidden) refreshPrices(true);
    }, 5 * 60 * 1000);
    return () => clearInterval(timer);
  }, []);

  // Gợi ý tìm tiếp dựa trên truy vấn vừa rồi
  const suggestionsAfter = (q) => {
    const have = new Set(q.comps || []);
    const pool = [];
    if (q.audience === 'business') {
      if (!q.requireStaticIP) pool.push('Doanh nghiệp IP tĩnh');
      if (!q.requireDynamicIP) pool.push('Doanh nghiệp IP động');
      pool.push('Doanh nghiệp dưới 500k');
    } else if (q.audience === 'personal') {
      pool.push('Home Cam', 'Home TV', 'Home Slay');
    } else {
      if (!have.has('cam')) pool.push('Camera');
      if (!have.has('mesh')) pool.push('Mesh');
      if (!have.has('mytv')) pool.push('MyTV');
      if (!have.has('fiber')) pool.push('Fiber');
      if (have.size >= 2) pool.unshift('Gói tích hợp');
      if (!q.maxPrice) pool.push('Dưới 200k');
      if (!q.onceOnly) pool.push('Mua luôn thiết bị');
    }
    return Array.from(new Set(pool)).slice(0, 5);
  };

  const pushSearch = (rawText, opts) => {
    opts = opts || {};
    if (!rawText && !(opts.comps && opts.comps.length) && !opts.minComponents && !opts.tableKey) return;

    const q = ENGINE.parseQuery(rawText || '');
    if (opts.comps && opts.comps.length) {
      q.comps = Array.from(new Set(q.comps.concat(opts.comps)));
      const labels = q.comps.map((c) => COMPONENTS[c].label).join(' + ');
      q.filters = ['Thành phần: ' + labels].concat(q.filters.filter((f) => !/^Thành phần:/.test(f)));
    }
    if (opts.minComponents) q.minComponents = opts.minComponents;
    if (opts.tableKey) q.tableKey = opts.tableKey;

    let userLabel = rawText || '';
    const tbl = opts.tableKey ? ENGINE.getTable(opts.tableKey) : null;
    if (tbl) userLabel = 'Xem cả bảng: ' + tbl.short;
    else if (!userLabel && opts.minComponents) userLabel = 'Gói tích hợp (≥ 2 dịch vụ)';
    else if (!userLabel) userLabel = q.comps.map((c) => COMPONENTS[c].label).join(' + ');

    setMessages((prev) => prev.concat({ id: nextId(), type: 'user', text: userLabel }));
    setInputValue('');
    setIsTyping(true);

    setTimeout(() => {
      const result = ENGINE.searchSmart(q);
      setIsTyping(false);

      let botText;
      if (result.total > 0) {
        botText = `✅ **${result.total} gói** phù hợp, nằm trong **${result.groups.length} bảng giá**.`;
        if (result.filters.length) botText += `\n🎯 Điều kiện: *${result.filters.join(' • ')}*`;
        if (result.relaxed) {
          botText += `\nℹ️ Không khớp chính xác từ khóa *"${(result.droppedTerms || []).join(' ')}"* nên đã nới lỏng, chỉ lọc theo thành phần/điều kiện.`;
        }
        botText += result.cheapMode
          ? '\n↕️ Đang xếp theo **giá thấp nhất trước** (bạn yêu cầu giá rẻ).'
          : '\n↕️ Đang xếp: **gói tích hợp trước**, rồi **giá thấp nhất trước**.';
        setMessages((prev) => prev.concat({
          id: nextId(), type: 'bot', text: botText, result,
          suggestions: suggestionsAfter(q), suggestionLimit: 5,
        }));
      } else {
        setMessages((prev) => prev.concat({
          id: nextId(), type: 'bot',
          text: `❌ Không có gói nào khớp với "${userLabel}".\nHãy thử bỏ bớt điều kiện, hoặc chọn một thành phần:`,
          suggestions: SUGGESTION_POOL, suggestionLimit: 8,
        }));
      }
    }, 320);
  };

  const handleSubmit = (text) => {
    const value = (text != null ? text : inputValue).trim();
    if (!value) return;
    pushSearch(value);
  };

  const quickChips = [
    { label: 'Fiber', icon: 'fa-globe', comps: ['fiber'] },
    { label: 'Mesh', icon: 'fa-router', comps: ['mesh'] },
    { label: 'Camera', icon: 'fa-video', comps: ['cam'] },
    { label: 'MyTV', icon: 'fa-tv', comps: ['mytv'] },
    { label: 'Camera + MyTV', icon: 'fa-video', comps: ['cam', 'mytv'], extra: 'fa-tv' },
    { label: 'Camera + Mesh', icon: 'fa-video', comps: ['cam', 'mesh'], extra: 'fa-router' },
    { label: 'Tích hợp', icon: 'fa-layer-group', minComponents: 2 },
  ];

  const live = sync.mode === 'live';
  const failedCount = (sync.failed || []).length;

  return (
    <div className="w-full h-full flex flex-col bg-slate-50">
      {/* Header */}
      <div className="bg-gradient-to-r from-blue-700 via-blue-600 to-indigo-700 px-4 py-3 flex items-center justify-between gap-2 z-10 shadow-md shrink-0">
        <div className="flex items-center gap-3 min-w-0">
          <div className="w-10 h-10 bg-white rounded-full flex items-center justify-center shadow-inner shrink-0 ring-2 ring-white/40">
            <span className="text-[11px] font-black text-blue-700 tracking-tighter leading-none">VNPT</span>
          </div>
          <div className="min-w-0">
            <h1 className="font-bold text-white text-[15px] uppercase tracking-wide leading-tight truncate">Trợ lý gói cước VNPT</h1>
            <p className="text-[10px] text-blue-100 flex items-center gap-1.5 mt-0.5 truncate">
              <span className={`w-1.5 h-1.5 rounded-full ${live ? 'bg-green-400 animate-pulse' : 'bg-amber-300'}`}></span>
              {ENGINE.getTables().length} bảng giá · {ENGINE.getPackages().length} gói · {live ? 'giá đồng bộ từ sheet' : 'dữ liệu lưu sẵn'}
            </p>
          </div>
        </div>

        <button onClick={() => refreshPrices(false)} disabled={syncing}
          title="Lấy giá mới nhất từ Google Sheet"
          className="flex items-center gap-1.5 text-[10.5px] font-bold text-white bg-white/10 hover:bg-white/25 border border-white/25 rounded-full px-2.5 sm:px-3 py-1.5 transition disabled:opacity-70 shrink-0">
          <i className={`fas ${syncing ? 'fa-circle-notch fa-spin' : 'fa-rotate'}`}></i>
          <span className="whitespace-nowrap">{syncing ? 'Đang lấy giá…' : live ? `Giá ${sync.at}` : 'Cập nhật giá'}</span>
        </button>
      </div>

      {/* Chat */}
      <div ref={chatRef} className="flex-1 overflow-y-auto scroll-thin p-3 sm:p-4 chat-bg">
        <div ref={contentRef} className="flex flex-col gap-4">
          {messages.map((msg) => (
            <div key={msg.id} className={`flex w-full ${msg.type === 'user' ? 'justify-end' : 'justify-start'} animate-fade-in-up`}>
              {msg.type === 'bot' && (
                <div className="w-8 h-8 rounded-full bg-blue-100 border border-blue-200 flex items-center justify-center mr-2.5 shrink-0 mt-0.5 shadow-sm">
                  <i className="fas fa-robot text-blue-600 text-[13px]"></i>
                </div>
              )}
              <div ref={msg.type === 'bot' ? lastResultRef : null}
                   className={`min-w-0 flex flex-col scroll-mt-3 ${msg.type === 'user' ? 'items-end max-w-[85%]' : 'items-start flex-1'}`}>
                {(msg.text || msg.welcome) && (
                  <div className={`px-3.5 py-2.5 text-[13px] leading-relaxed shadow-sm ${
                    msg.type === 'user'
                      ? 'bg-blue-600 text-white rounded-2xl rounded-tr-sm font-medium whitespace-pre-wrap'
                      : 'bg-white text-slate-700 border border-slate-100 rounded-2xl rounded-tl-sm'
                  }`} dangerouslySetInnerHTML={{ __html: richText(msg.welcome ? welcomeText() : msg.text) }} />
                )}

                {msg.suggestions && <SuggestionList items={msg.suggestions} limit={msg.suggestionLimit || 10} onPick={handleSubmit} />}

                {msg.result && (
                  <div className="w-full">
                    <ResultPanel result={msg.result} onShowTable={(key) => pushSearch('', { tableKey: key })} />
                  </div>
                )}
              </div>
            </div>
          ))}

          {isTyping && (
            <div className="flex w-full justify-start animate-fade-in-up">
              <div className="w-8 h-8 rounded-full bg-blue-100 border border-blue-200 flex items-center justify-center mr-2.5 shrink-0">
                <i className="fas fa-robot text-blue-600 text-[13px]"></i>
              </div>
              <div className="bg-white border border-slate-100 px-4 py-3 rounded-2xl rounded-tl-sm shadow-sm flex items-center gap-1.5">
                <span className="w-1.5 h-1.5 bg-blue-400 rounded-full animate-bounce" style={{ animationDelay: '0ms' }}></span>
                <span className="w-1.5 h-1.5 bg-blue-400 rounded-full animate-bounce" style={{ animationDelay: '150ms' }}></span>
                <span className="w-1.5 h-1.5 bg-blue-400 rounded-full animate-bounce" style={{ animationDelay: '300ms' }}></span>
              </div>
            </div>
          )}
          <div ref={messagesEndRef} className="h-1" />
        </div>
      </div>

      {/* Lối tắt thành phần */}
      <div className="px-3 pt-2 bg-white border-t border-slate-200 shrink-0">
        <div className="flex gap-1.5 overflow-x-auto chip-scroll pb-0.5">
          <span className="text-[10px] font-bold uppercase text-slate-400 self-center pr-1 shrink-0">Chọn nhanh:</span>
          {quickChips.map((c) => (
            <button key={c.label}
              onClick={() => pushSearch('', { comps: c.comps, minComponents: c.minComponents })}
              className={`shrink-0 text-[11px] font-bold px-2.5 py-1 rounded-full border transition-all active:scale-95 hover:shadow-sm ${
                c.minComponents ? 'bg-emerald-50 text-emerald-700 border-emerald-200 hover:bg-emerald-100'
                                : 'bg-white text-slate-600 border-slate-300 hover:border-blue-400 hover:text-blue-700'
              }`}>
              <i className={`fas ${c.icon} mr-1 text-[10px]`}></i>{c.label}
            </button>
          ))}
        </div>
      </div>

      {/* Ô nhập */}
      <div className="px-3 pt-2 pb-3 bg-white shrink-0">
        <div className="flex items-center gap-2 rounded-2xl p-1.5 bg-slate-50 border border-slate-300 focus-within:border-blue-500 focus-within:bg-white focus-within:ring-2 focus-within:ring-blue-100 transition-all">
          <i className="fas fa-magnifying-glass ml-2.5 text-blue-500 text-[13px]"></i>
          <input
            type="text"
            value={inputValue}
            onChange={(e) => setInputValue(e.target.value)}
            onKeyDown={(e) => { if (e.key === 'Enter') handleSubmit(); }}
            placeholder="VD: gói tích hợp gồm Fiber, MyTV, Mesh, camera dưới 300k..."
            className="flex-grow bg-transparent border-none outline-none text-[13.5px] text-slate-800 placeholder-slate-400 py-2 w-full font-medium"
          />
          <button onClick={() => handleSubmit()} disabled={!inputValue.trim()}
            className="w-9 h-9 rounded-xl bg-blue-600 text-white flex items-center justify-center disabled:bg-slate-300 disabled:shadow-none transition-all shadow-md active:scale-95 shrink-0">
            <i className="fas fa-paper-plane text-[13px]"></i>
          </button>
        </div>
        <p className="mt-1.5 text-center text-[9.5px] text-slate-400">
          Nguồn: <a className="underline hover:text-blue-500" href={ENGINE.META.source} target="_blank" rel="noopener">Google Sheet gói cước</a>
          {' · '}{live ? 'đồng bộ' : 'bản lưu'} {sync.at}
          {failedCount ? ` · ${failedCount} bảng dùng bản lưu` : ''}
          {' · '}mỗi bảng giá là một bảng gói cước
        </p>
      </div>
    </div>
  );
};

ReactDOM.createRoot(document.getElementById('root')).render(<App />);
</script>
</body>
</html>
